name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BAZEL_VERSION: "9.2.0"
  BAZEL_LINUX_X86_64_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694

jobs:
  bazel:
    name: Bazel public baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Bazel remote cache variables
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          configured=0
          for value in "$CACHE_PROJECT" "$CACHE_URL" "$CACHE_PROVIDER" "$CACHE_WRITER"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo 'Bazel remote cache is not provisioned; continuing without it.'
          elif [ "$configured" -ne 4 ]; then
            echo 'Bazel remote cache repository variables are incomplete.' >&2
            exit 1
          elif [[ ! "$CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/gizos/?$ ]]; then
            echo 'BAZEL_REMOTE_CACHE_URL must be https://storage.googleapis.com/<bucket>/gizos.' >&2
            exit 1
          fi

      - name: Authenticate Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install and verify Bazel
        shell: bash
        run: |
          bazel_path="$RUNNER_TEMP/bazel"
          curl --fail --location --silent --show-error \
            "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" \
            --output "$bazel_path"
          test "$(shasum -a 256 "$bazel_path" | awk '{print $1}')" = "$BAZEL_LINUX_X86_64_SHA256"
          chmod +x "$bazel_path"
          printf 'BAZEL=%s\n' "$bazel_path" >> "$GITHUB_ENV"

      - name: Validate public graph
        env:
          BAZEL_REMOTE_CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
        shell: bash
        run: |
          cache_args=()
          if [ -n "$BAZEL_REMOTE_CACHE_URL" ]; then
            cache_args=(
              "--remote_cache=${BAZEL_REMOTE_CACHE_URL%/}"
              --google_default_credentials
              --remote_timeout=60
              --remote_retries=5
              --remote_upload_local_results=true
            )
          fi
          "$BAZEL" "${cache_args[@]}" query //...
          "$BAZEL" "${cache_args[@]}" build --remote_download_outputs=minimal //...
          "$BAZEL" "${cache_args[@]}" test --remote_download_outputs=minimal //...
