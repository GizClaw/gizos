name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checkout_sha:
        description: Exact commit to build; defaults to the selected ref
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.checkout_sha || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  BAZEL_VERSION: "9.2.0"
  BAZEL_LINUX_X86_64_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
  BAZEL_MACOS_ARM64_SHA256: dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6
  BAZEL_WINDOWS_X86_64_SHA256: 5fc2f2805b8c697a54732558576938d06bab63aa0f9b6610cc01d2cae0388705

jobs:
  private-dependencies:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Private dependency access
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - id: app-token
        name: Create read-only h2vivi token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.H2VIVI_GITHUB_APP_ID }}
          private-key: ${{ secrets.H2VIVI_GITHUB_APP_PRIVATE_KEY }}
          owner: h2vivi

      - name: Check out Firmwares devenv manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: h2vivi/firmware-devenv
          path: firmware-devenv
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify private SDK repository access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          test -f firmware-devenv/export.sh
          for repository in \
            firmware-devenv \
            bk-avdk-smp \
            bk3633 \
            AC695N_Soundbox_SDK \
            fw-AC791N_SDK; do
            test "$(gh api "repos/h2vivi/$repository" --jq .full_name)" = "h2vivi/$repository"
          done

  host:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 / Build + Test
            runner: ${{ vars.FIRMWARE_LINUX_8CORE_RUNNER }}
            config: linux_x86_64
            task: build-test
            asset: linux-x86_64
            sha: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
            timeout: 120
          - name: macOS arm64 / Build + Test
            runner: ${{ vars.FIRMWARE_MACOS_RUNNER }}
            config: macos_arm64
            task: build-test
            asset: darwin-arm64
            sha: dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6
            timeout: 70
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_sha || github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          apt_network_options=(
            -o Acquire::Retries=0
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_network_options[@]}" update
          sudo apt-get "${apt_network_options[@]}" install --yes \
            cmake doxygen lcov libasound2-dev libx11-dev libxext-dev \
            libxi-dev libxrandr-dev libssl-dev nasm ninja-build \
            pkg-config ripgrep unzip

      - name: Install macOS dependencies and select Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake doxygen lcov ninja pkg-config ripgrep rsync
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"

      - name: Validate Bazel remote cache variables
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          NATIVE_CACHE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        shell: bash
        run: |
          configured=0
          for value in "$CACHE_PROJECT" "$CACHE_URL" "$CACHE_PROVIDER" "$CACHE_WRITER"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo 'Bazel remote cache is not provisioned; using the job-local disk cache.'
          elif [ "$configured" -ne 4 ]; then
            echo 'Bazel remote cache repository variables are incomplete.' >&2
            exit 1
          elif [[ ! "$CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/gizos$ ]]; then
            echo 'BAZEL_REMOTE_CACHE_URL must be https://storage.googleapis.com/<bucket>/gizos.' >&2
            exit 1
          fi
          if [ -n "$NATIVE_CACHE_URL" ]; then
            if [ "$configured" -ne 4 ]; then
              echo 'Native ccache GCS requires the Bazel cache WIF variables.' >&2
              exit 1
            fi
            if [[ ! "$NATIVE_CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/ccache$ ]]; then
              echo 'NATIVE_CCACHE_GCS_BASE_URL must be https://storage.googleapis.com/<bucket>/ccache.' >&2
              exit 1
            fi
            native_bucket=${NATIVE_CACHE_URL#https://storage.googleapis.com/}
            native_bucket=${native_bucket%/ccache}
            bazel_bucket=${CACHE_URL#https://storage.googleapis.com/}
            bazel_bucket=${bazel_bucket%/gizos}
            if [ "$native_bucket" != "$bazel_bucket" ]; then
              echo 'Native ccache and Bazel remote cache must use isolated prefixes in the same bucket.' >&2
              exit 1
            fi
          fi

      - name: Authenticate Bazel remote cache
        if: >-
          vars.BAZEL_REMOTE_CACHE_URL != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Restore Bazel repository cache
        id: bazel-repository-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: bazel-repository-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install and verify Bazel
        shell: bash
        run: |
          bazel_path="$RUNNER_TEMP/bazel"
          curl --fail --location --silent --show-error \
            "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-${{ matrix.asset }}" \
            --output "$bazel_path"
          test "$(shasum -a 256 "$bazel_path" | awk '{print $1}')" = "${{ matrix.sha }}"
          chmod +x "$bazel_path"
          {
            printf 'BAZEL_BIN=%s\n' "$bazel_path"
            printf 'BAZEL_CONFIG=%s\n' '${{ matrix.config }}'
            printf 'BAZEL_BUILD_REMOTE_DOWNLOAD_OUTPUTS=minimal\n'
          } >> "$GITHUB_ENV"

      - name: Configure Bazel remote cache
        if: >-
          vars.BAZEL_REMOTE_CACHE_URL != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          {
            printf 'BAZEL_REMOTE_CACHE_URL=%s\n' '${{ vars.BAZEL_REMOTE_CACHE_URL }}'
            printf 'BAZEL_REMOTE_CACHE_MODE=write\n'
            printf 'BAZEL_DISK_CACHE_MODE=off\n'
          } >> "$GITHUB_ENV"

      - name: Build compatible graph
        run: make bazel-build

      - name: Test compatible graph
        if: matrix.task == 'build-test'
        run: make bazel-test

      - name: Test downstream Bzlmod consumer
        if: matrix.config == 'macos_arm64'
        run: make bazel-test-downstream-consumer

      - name: Test repository policy scripts
        if: matrix.config == 'linux_x86_64'
        run: >-
          node --test
          .github/scripts/merge-eligibility-status/test.mjs
          .github/scripts/ownership-approval/test.mjs

      - name: Save Bazel repository cache seed
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.bazel-repository-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: ${{ steps.bazel-repository-cache.outputs.cache-primary-key }}

  extended-platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.config == 'kickpi_k4b' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator arm64 / Build
            runner: macos-15
            config: ios_sim_arm64
            task: build
            asset: darwin-arm64
            sha: dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6
            timeout: 45
          - name: iOS Simulator arm64 / Test
            runner: macos-15
            config: ios_sim_arm64
            task: test
            asset: darwin-arm64
            sha: dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6
            timeout: 45
          - name: Android arm64 / Build + Test
            runner: ${{ vars.FIRMWARE_LINUX_4CORE_RUNNER }}
            config: android_arm64
            task: build-test
            asset: linux-x86_64
            sha: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
            timeout: 70
          - name: Test coverage
            runner: ${{ vars.FIRMWARE_LINUX_4CORE_RUNNER }}
            config: test_coverage
            task: coverage
            asset: linux-x86_64
            sha: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
            timeout: 60
          - name: KickPi K4B / Build (non-blocking)
            runner: ${{ vars.FIRMWARE_LINUX_4CORE_RUNNER }}
            config: kickpi_k4b
            task: build
            asset: linux-x86_64
            sha: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
            timeout: 60
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_sha || github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          apt_network_options=(
            -o Acquire::Retries=0
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_network_options[@]}" update
          sudo apt-get "${apt_network_options[@]}" install --yes \
            cmake doxygen lcov libasound2-dev libx11-dev libxext-dev \
            libxi-dev libxrandr-dev libssl-dev nasm ninja-build \
            pkg-config ripgrep unzip

      - name: Install macOS dependencies and select Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake doxygen lcov ninja pkg-config ripgrep rsync
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"

      - name: Install coverage toolchain compatibility dependency
        if: matrix.config == 'test_coverage'
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.2_amd64.deb \
            --output "$RUNNER_TEMP/libtinfo5.deb"
          printf '%s  %s\n' \
            b9bb64e716a7d9de05b1b33992763142ca81bcae3a7f8ce7e29fa3c6fd32f1e8 \
            "$RUNNER_TEMP/libtinfo5.deb" | sha256sum --check --strict
          sudo apt-get install --yes "$RUNNER_TEMP/libtinfo5.deb"

      - name: Install Android SDK and NDK
        if: matrix.config == 'android_arm64'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "platforms;android-$ANDROID_API_LEVEL"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' \
            "$ANDROID_HOME" "$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Validate Bazel remote cache variables
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          NATIVE_CACHE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        shell: bash
        run: |
          configured=0
          for value in "$CACHE_PROJECT" "$CACHE_URL" "$CACHE_PROVIDER" "$CACHE_WRITER"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo 'Bazel remote cache is not provisioned; using the job-local disk cache.'
          elif [ "$configured" -ne 4 ]; then
            echo 'Bazel remote cache repository variables are incomplete.' >&2
            exit 1
          elif [[ ! "$CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/gizos$ ]]; then
            echo 'BAZEL_REMOTE_CACHE_URL must be https://storage.googleapis.com/<bucket>/gizos.' >&2
            exit 1
          fi
          if [ -n "$NATIVE_CACHE_URL" ]; then
            if [ "$configured" -ne 4 ]; then
              echo 'Native ccache GCS requires the Bazel cache WIF variables.' >&2
              exit 1
            fi
            if [[ ! "$NATIVE_CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/ccache$ ]]; then
              echo 'NATIVE_CCACHE_GCS_BASE_URL must be https://storage.googleapis.com/<bucket>/ccache.' >&2
              exit 1
            fi
            native_bucket=${NATIVE_CACHE_URL#https://storage.googleapis.com/}
            native_bucket=${native_bucket%/ccache}
            bazel_bucket=${CACHE_URL#https://storage.googleapis.com/}
            bazel_bucket=${bazel_bucket%/gizos}
            if [ "$native_bucket" != "$bazel_bucket" ]; then
              echo 'Native ccache and Bazel remote cache must use isolated prefixes in the same bucket.' >&2
              exit 1
            fi
          fi

      - name: Authenticate Bazel remote cache
        if: >-
          vars.BAZEL_REMOTE_CACHE_URL != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Restore Bazel repository cache
        id: bazel-repository-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: bazel-repository-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install and verify Bazel
        shell: bash
        run: |
          bazel_path="$RUNNER_TEMP/bazel"
          curl --fail --location --silent --show-error \
            "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-${{ matrix.asset }}" \
            --output "$bazel_path"
          test "$(shasum -a 256 "$bazel_path" | awk '{print $1}')" = "${{ matrix.sha }}"
          chmod +x "$bazel_path"
          {
            printf 'BAZEL_BIN=%s\n' "$bazel_path"
            printf 'BAZEL_CONFIG=%s\n' '${{ matrix.config }}'
            printf 'BAZEL_BUILD_REMOTE_DOWNLOAD_OUTPUTS=minimal\n'
          } >> "$GITHUB_ENV"

      - name: Configure Bazel remote cache
        if: >-
          vars.BAZEL_REMOTE_CACHE_URL != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          {
            printf 'BAZEL_REMOTE_CACHE_URL=%s\n' '${{ vars.BAZEL_REMOTE_CACHE_URL }}'
            printf 'BAZEL_REMOTE_CACHE_MODE=write\n'
            printf 'BAZEL_DISK_CACHE_MODE=off\n'
          } >> "$GITHUB_ENV"

      - name: Execute platform task
        shell: bash
        run: |
          case '${{ matrix.task }}' in
            build)
              make bazel-build
              ;;
            test)
              make bazel-test
              ;;
            build-test)
              make bazel-build
              make bazel-test
              ;;
            coverage)
              make bazel-coverage-report
              ;;
            *)
              echo 'unknown execution task: ${{ matrix.task }}' >&2
              exit 2
              ;;
          esac

      - name: Publish coverage summary
        if: always() && matrix.config == 'test_coverage'
        shell: bash
        run: |
          if [ -s build/coverage/test/summary.md ]; then
            cat build/coverage/test/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always() && matrix.config == 'test_coverage'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage
          path: build/coverage/test/
          if-no-files-found: error
          retention-days: 14

      - name: Save Bazel repository cache seed
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.bazel-repository-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: ${{ steps.bazel-repository-cache.outputs.cache-primary-key }}

  esp-compatible-graph:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    needs: private-dependencies
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-S3 / Build
            config: esp32s3
            runner: ${{ vars.FIRMWARE_LINUX_8CORE_RUNNER }}
          - name: ESP32-P4 / Build
            config: esp32p4
            runner: ${{ vars.FIRMWARE_LINUX_RUNNER }}
          - name: ESP32-C5 / Build
            config: esp32c5
            runner: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_sha || github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - id: app-token
        name: Create read-only h2vivi token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.H2VIVI_GITHUB_APP_ID }}
          private-key: ${{ secrets.H2VIVI_GITHUB_APP_PRIVATE_KEY }}
          owner: h2vivi

      - name: Check out Firmwares devenv
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: h2vivi/firmware-devenv
          path: firmware-devenv
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out ESP-IDF from Firmwares devenv
        shell: bash
        run: git -C firmware-devenv submodule update --init --depth 1 third_party/esp_idf_6.0

      - name: Restore ESP-IDF tool cache
        id: esp-idf-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: firmware-devenv/.tools/esp-idf
          key: esp-idf-v2-${{ runner.os }}-${{ hashFiles('tools/bazel/native_versions/esp_idf_commit.txt') }}-esp32s3-esp32p4-esp32c5

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          export IDF_TOOLS_PATH="$GITHUB_WORKSPACE/firmware-devenv/.tools/esp-idf"
          firmware-devenv/third_party/esp_idf_6.0/install.sh esp32s3,esp32p4,esp32c5

      - name: Install native compiler cache
        shell: bash
        run: |
          manifest=tools/bazel/native_versions/native_ccache_tools.txt
          read -r _ ccache_version ccache_sha256 ccache_url < <(awk '$1 == "ccache" { print; exit }' "$manifest")
          read -r _ helper_version helper_sha256 helper_url < <(awk '$1 == "ccache-storage-http-go" { print; exit }' "$manifest")
          test "$ccache_version" = 4.13.6
          test "$helper_version" = 0.8
          runtime_root="$RUNNER_TEMP/native-ccache-runtime"
          mkdir -p "$runtime_root/bin" "$runtime_root/cache" "$runtime_root/ccache" "$runtime_root/helper"
          curl --fail --location --silent --show-error "$ccache_url" --output "$runtime_root/ccache.tar.xz"
          printf '%s  %s\n' "$ccache_sha256" "$runtime_root/ccache.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$runtime_root/ccache.tar.xz" --strip-components=1 --directory "$runtime_root/ccache"
          curl --fail --location --silent --show-error "$helper_url" --output "$runtime_root/helper.tar.gz"
          printf '%s  %s\n' "$helper_sha256" "$runtime_root/helper.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$runtime_root/helper.tar.gz" --strip-components=1 --directory "$runtime_root/helper"
          install -m 0755 "$runtime_root/ccache/ccache" "$runtime_root/bin/ccache"
          install -m 0755 "$runtime_root/helper/ccache-storage-http" "$runtime_root/bin/ccache-storage-https"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache"}\n' > "$runtime_root/runtime.json"
          printf '%s\n' "$runtime_root/bin" >> "$GITHUB_PATH"
          printf 'H2_NATIVE_CCACHE_RUNTIME_ROOT=%s\n' "$runtime_root" >> "$GITHUB_ENV"

      - name: Configure native compiler cache
        shell: bash
        run: |
          "$H2_NATIVE_CCACHE_RUNTIME_ROOT/bin/ccache" --version

      - name: Validate Bazel remote cache variables
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          NATIVE_CACHE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        shell: bash
        run: |
          configured=0
          for value in "$CACHE_PROJECT" "$CACHE_URL" "$CACHE_PROVIDER" "$CACHE_WRITER"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo 'Bazel remote cache is not provisioned; using the job-local disk cache.'
          elif [ "$configured" -ne 4 ]; then
            echo 'Bazel remote cache repository variables are incomplete.' >&2
            exit 1
          elif [[ ! "$CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/gizos$ ]]; then
            echo 'BAZEL_REMOTE_CACHE_URL must be https://storage.googleapis.com/<bucket>/gizos.' >&2
            exit 1
          fi
          if [ -n "$NATIVE_CACHE_URL" ]; then
            if [ "$configured" -ne 4 ]; then
              echo 'Native ccache GCS requires the Bazel cache WIF variables.' >&2
              exit 1
            fi
            if [[ ! "$NATIVE_CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/ccache$ ]]; then
              echo 'NATIVE_CCACHE_GCS_BASE_URL must be https://storage.googleapis.com/<bucket>/ccache.' >&2
              exit 1
            fi
            native_bucket=${NATIVE_CACHE_URL#https://storage.googleapis.com/}
            native_bucket=${native_bucket%/ccache}
            bazel_bucket=${CACHE_URL#https://storage.googleapis.com/}
            bazel_bucket=${bazel_bucket%/gizos}
            if [ "$native_bucket" != "$bazel_bucket" ]; then
              echo 'Native ccache and Bazel remote cache must use isolated prefixes in the same bucket.' >&2
              exit 1
            fi
          fi

      - name: Authenticate Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Restore Bazel repository cache
        id: bazel-repository-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: bazel-repository-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install and verify Bazel
        shell: bash
        run: |
          bazel_path="$RUNNER_TEMP/bazel"
          curl --fail --location --silent --show-error \
            "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" \
            --output "$bazel_path"
          test "$(sha256sum "$bazel_path" | awk '{print $1}')" = "$BAZEL_LINUX_X86_64_SHA256"
          chmod +x "$bazel_path"
          printf 'BAZEL_BIN=%s\n' "$bazel_path" >> "$GITHUB_ENV"

      - name: Configure Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        shell: bash
        run: |
          {
            printf 'BAZEL_REMOTE_CACHE_URL=%s\n' '${{ vars.BAZEL_REMOTE_CACHE_URL }}'
            printf 'BAZEL_REMOTE_CACHE_MODE=write\n'
            printf 'BAZEL_DISK_CACHE_MODE=off\n'
          } >> "$GITHUB_ENV"

      - name: Refresh native compiler cache token
        id: native-ccache-auth
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Configure native compiler cache GCS access
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != ''
        env:
          NATIVE_CCACHE_ACCESS_TOKEN: ${{ steps.native-ccache-auth.outputs.access_token }}
          NATIVE_CCACHE_GCS_BASE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        shell: bash
        run: |
          token_file="$H2_NATIVE_CCACHE_RUNTIME_ROOT/token"
          install -m 0600 /dev/null "$token_file"
          printf '%s' "$NATIVE_CCACHE_ACCESS_TOKEN" > "$token_file"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache","remote_base_url":"%s","storage_helper":"bin/ccache-storage-https","token_file":"token"}\n' "$NATIVE_CCACHE_GCS_BASE_URL" > "$H2_NATIVE_CCACHE_RUNTIME_ROOT/runtime.json"

      - name: Configure ESP Wi-Fi build credentials
        env:
          WIFI_PASSWORD: ${{ secrets.H2LOADER_WIFI_PASSWORD }}
        shell: bash
        run: |
          credentials="$(
            python3 - <<'PY'
          import json
          import os

          print(json.dumps(
              {"ssid": "HAIVIVI-MFG", "password": os.environ["WIFI_PASSWORD"]},
              separators=(",", ":"),
          ))
          PY
          )"
          printf 'H2LOADER_WIFI_CREDENTIALS=%s\n' "$credentials" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.config }} compatible graph
        shell: bash
        run: |
          . firmware-devenv/export.sh
