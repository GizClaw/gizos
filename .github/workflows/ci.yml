  legacy-firmware:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    needs: private-dependencies
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BK3633 / Build
            config: bk3633
            repository: h2vivi/bk3633
            sdk_commit: c963da8e73440400ee6839b4bfd20ca6e6ec7908
          - name: JieLi AC695N / Build
            config: ac695n
            repository: h2vivi/AC695N_Soundbox_SDK
            sdk_commit: 76b95777a083818dd9a3a492d9c70ad81baa6b8a
          - name: JieLi AC791N / Build
            config: ac791n
            repository: h2vivi/fw-AC791N_SDK
            sdk_commit: eb04f1966cf2b7cbb72cbb54db906bcb293b5a4a
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_sha || github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - id: app-token
        name: Create read-only h2vivi token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.H2VIVI_GITHUB_APP_ID }}
          private-key: ${{ secrets.H2VIVI_GITHUB_APP_PRIVATE_KEY }}
          owner: h2vivi

      - name: Check out pinned native SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sdk_commit }}
          path: .native-sdk
          fetch-depth: 1
          persist-credentials: ${{ matrix.config == 'ac791n' }}
          submodules: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Restore AC791N SDK LFS objects
        id: ac791n-lfs-cache
        if: matrix.config == 'ac791n'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .native-sdk/.git/lfs
          key: jieli-ac791n-sdk-lfs-${{ matrix.sdk_commit }}

      - name: Materialize AC791N SDK LFS objects
        if: matrix.config == 'ac791n'
        timeout-minutes: 20
        shell: bash
        run: |
          git -C .native-sdk lfs install --local
          git -C .native-sdk lfs pull
          git -C .native-sdk lfs fsck --pointers
          git -C .native-sdk config --unset-all http.https://github.com/.extraheader || true
          git -C .native-sdk config --unset-all core.sshCommand || true

      - name: Install JieLi post-build runtime
        if: matrix.config == 'ac695n' || matrix.config == 'ac791n'
        timeout-minutes: 5
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=0 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install --yes \
            libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 \
            libice6 libsm6 libx11-6 libxext6 libxkbcommon0

      - name: Check out JieLi toolchain archives
        if: matrix.config == 'ac695n' || matrix.config == 'ac791n'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: h2vivi/firmware-devenv
          path: .firmware-devenv-jieli
          fetch-depth: 1
          lfs: false
          persist-credentials: true
          sparse-checkout: tools/jieli_toolchain
          submodules: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Restore JieLi toolchain archive LFS objects
        id: jieli-toolchain-lfs-cache
        if: matrix.config == 'ac695n' || matrix.config == 'ac791n'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .firmware-devenv-jieli/.git/lfs
          key: jieli-toolchain-lfs-${{ hashFiles('tools/bazel/native_versions/jieli_toolchain_archives.txt') }}

      - name: Materialize JieLi toolchain archives
        if: matrix.config == 'ac695n' || matrix.config == 'ac791n'
        timeout-minutes: 20
        shell: bash
        run: |
          git -C .firmware-devenv-jieli lfs install --local
          git -C .firmware-devenv-jieli lfs pull --include='tools/jieli_toolchain/archives/**'
          git -C .firmware-devenv-jieli config --unset-all http.https://github.com/.extraheader || true
          git -C .firmware-devenv-jieli config --unset-all core.sshCommand || true

      - name: Configure native SDK and toolchain locators
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.config }}' in
            bk3633)
              printf 'BK3633_PATH=%s/.native-sdk\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              ;;
            ac695n|ac791n)
              root="$RUNNER_TEMP/jieli"
              JIELI_TOOLS_DIR="$root" sh \
                "$GITHUB_WORKSPACE/.firmware-devenv-jieli/tools/jieli_toolchain/bootstrap.sh"
              manifest=tools/bazel/native_versions/jieli_toolchain_archives.txt
              while read -r kind _ _ _ directory; do
                case "$kind" in ''|'#'*) continue ;; esac
                test -d "$root/$directory"
                case "$kind" in
                  toolchain) printf 'JIELI_TOOLCHAIN_ROOT=%s/%s\n' "$root" "$directory" >> "$GITHUB_ENV" ;;
                  postbuild) printf 'JIELI_POSTBUILD_ROOT=%s/%s\n' "$root" "$directory" >> "$GITHUB_ENV" ;;
                esac
              done < "$manifest"
              if [ '${{ matrix.config }}' = ac695n ]; then
                printf 'JIELI_AC695N_SDK_PATH=%s/.native-sdk/SDK\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              else
                printf 'JIELI_AC791N_SDK_PATH=%s/.native-sdk\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              fi
              ;;
          esac

      - name: Install native compiler cache
        if: matrix.config == 'bk3633'
        shell: bash
        run: |
          manifest=tools/bazel/native_versions/native_ccache_tools.txt
          read -r _ ccache_version ccache_sha256 ccache_url < <(awk '$1 == "ccache" { print; exit }' "$manifest")
          read -r _ helper_version helper_sha256 helper_url < <(awk '$1 == "ccache-storage-http-go" { print; exit }' "$manifest")
          test "$ccache_version" = 4.13.6
          test "$helper_version" = 0.8
          runtime_root="$RUNNER_TEMP/native-ccache-runtime"
          mkdir -p "$runtime_root/bin" "$runtime_root/cache" "$runtime_root/ccache" "$runtime_root/helper"
          curl --fail --location --silent --show-error "$ccache_url" --output "$runtime_root/ccache.tar.xz"
          printf '%s  %s\n' "$ccache_sha256" "$runtime_root/ccache.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$runtime_root/ccache.tar.xz" --strip-components=1 --directory "$runtime_root/ccache"
          curl --fail --location --silent --show-error "$helper_url" --output "$runtime_root/helper.tar.gz"
          printf '%s  %s\n' "$helper_sha256" "$runtime_root/helper.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$runtime_root/helper.tar.gz" --strip-components=1 --directory "$runtime_root/helper"
          install -m 0755 "$runtime_root/ccache/ccache" "$runtime_root/bin/ccache"
          install -m 0755 "$runtime_root/helper/ccache-storage-http" "$runtime_root/bin/ccache-storage-https"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache"}\n' > "$runtime_root/runtime.json"
          printf '%s\n' "$runtime_root/bin" >> "$GITHUB_PATH"
          printf 'H2_NATIVE_CCACHE_RUNTIME_ROOT=%s\n' "$runtime_root" >> "$GITHUB_ENV"

      - name: Validate Bazel remote cache variables
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          NATIVE_CACHE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        shell: bash
        run: |
          configured=0
          for value in "$CACHE_PROJECT" "$CACHE_URL" "$CACHE_PROVIDER" "$CACHE_WRITER"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo 'Bazel remote cache is not provisioned; using the job-local disk cache.'
          elif [ "$configured" -ne 4 ]; then
            echo 'Bazel remote cache repository variables are incomplete.' >&2
            exit 1
          elif [[ ! "$CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/gizos$ ]]; then
            echo 'BAZEL_REMOTE_CACHE_URL must be https://storage.googleapis.com/<bucket>/gizos.' >&2
            exit 1
          fi
          if [ -n "$NATIVE_CACHE_URL" ]; then
            if [ "$configured" -ne 4 ]; then
              echo 'Native ccache GCS requires the Bazel cache WIF variables.' >&2
              exit 1
            fi
            if [[ ! "$NATIVE_CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/ccache$ ]]; then
              echo 'NATIVE_CCACHE_GCS_BASE_URL must be https://storage.googleapis.com/<bucket>/ccache.' >&2
              exit 1
            fi
            native_bucket=${NATIVE_CACHE_URL#https://storage.googleapis.com/}
            native_bucket=${native_bucket%/ccache}
            bazel_bucket=${CACHE_URL#https://storage.googleapis.com/}
            bazel_bucket=${bazel_bucket%/gizos}
            if [ "$native_bucket" != "$bazel_bucket" ]; then
              echo 'Native ccache and Bazel remote cache must use isolated prefixes in the same bucket.' >&2
              exit 1
            fi
          fi

      - name: Authenticate Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Restore Bazel repository cache
        id: bazel-repository-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: bazel-repository-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install and verify Bazel
        shell: bash
        run: |
          bazel_path="$RUNNER_TEMP/bazel"
          curl --fail --location --silent --show-error \
            "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" \
            --output "$bazel_path"
          test "$(sha256sum "$bazel_path" | awk '{print $1}')" = "$BAZEL_LINUX_X86_64_SHA256"
          chmod +x "$bazel_path"
          printf 'BAZEL_BIN=%s\n' "$bazel_path" >> "$GITHUB_ENV"

      - name: Configure Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        shell: bash
        run: |
          {
            printf 'BAZEL_REMOTE_CACHE_URL=%s\n' '${{ vars.BAZEL_REMOTE_CACHE_URL }}'
            printf 'BAZEL_REMOTE_CACHE_MODE=write\n'
            printf 'BAZEL_DISK_CACHE_MODE=off\n'
          } >> "$GITHUB_ENV"

      - name: Refresh native compiler cache token
        id: native-ccache-auth
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != '' && matrix.config == 'bk3633'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Configure native compiler cache GCS access
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != '' && matrix.config == 'bk3633'
        env:
          NATIVE_CCACHE_ACCESS_TOKEN: ${{ steps.native-ccache-auth.outputs.access_token }}
          NATIVE_CCACHE_GCS_BASE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        shell: bash
        run: |
          token_file="$H2_NATIVE_CCACHE_RUNTIME_ROOT/token"
          install -m 0600 /dev/null "$token_file"
          printf '%s' "$NATIVE_CCACHE_ACCESS_TOKEN" > "$token_file"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache","remote_base_url":"%s","storage_helper":"bin/ccache-storage-https","token_file":"token"}\n' "$NATIVE_CCACHE_GCS_BASE_URL" > "$H2_NATIVE_CCACHE_RUNTIME_ROOT/runtime.json"

      - name: Build legacy-chip compatible graph
        shell: bash
        run: make bazel-build BAZEL_CONFIG=${{ matrix.config }}

      - name: Show native compiler cache statistics
        if: always() && matrix.config == 'bk3633'
        continue-on-error: true
        shell: bash
        run: CCACHE_DIR="$H2_NATIVE_CCACHE_RUNTIME_ROOT/cache/bk3633" "$H2_NATIVE_CCACHE_RUNTIME_ROOT/bin/ccache" --show-stats

      - name: Save AC791N SDK LFS cache seed
        if: >-
          matrix.config == 'ac791n' && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.ac791n-lfs-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .native-sdk/.git/lfs
          key: ${{ steps.ac791n-lfs-cache.outputs.cache-primary-key }}

      - name: Save JieLi toolchain archive LFS cache seed
        if: >-
          (matrix.config == 'ac695n' || matrix.config == 'ac791n') &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.jieli-toolchain-lfs-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .firmware-devenv-jieli/.git/lfs
          key: ${{ steps.jieli-toolchain-lfs-cache.outputs.cache-primary-key }}

      - name: Save Bazel repository cache seed
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.bazel-repository-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: ${{ steps.bazel-repository-cache.outputs.cache-primary-key }}

  windows-compatible-graph:
    name: Windows x86_64 / Build + Test
    runs-on: ${{ vars.FIRMWARE_WINDOWS_RUNNER }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.checkout_sha || github.event.pull_request.head.sha || github.sha }}
          submodules: false

      - name: Validate Bazel remote cache variables
        shell: pwsh
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
        run: |
          $configured = @(
            $env:CACHE_PROJECT,
            $env:CACHE_PROVIDER,
            $env:CACHE_URL,
            $env:CACHE_WRITER
          ).Where({ $_ }).Count
          if ($configured -eq 0) {
            Write-Host 'Bazel remote cache is not provisioned; using the job-local disk cache.'
          } elseif ($configured -ne 4) {
            throw 'Bazel remote cache repository variables are incomplete.'
          } elseif ($env:CACHE_URL -notmatch '^https://storage\.googleapis\.com/[^/]+/gizos$') {
            throw 'BAZEL_REMOTE_CACHE_URL must use the /gizos prefix.'
          }

      - name: Authenticate Bazel remote cache
        if: >-
          vars.BAZEL_REMOTE_CACHE_URL != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Restore Bazel repository cache
        id: bazel-repository-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: bazel-repository-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install and verify Bazel
        shell: pwsh
        run: |
          $bazel = Join-Path $env:RUNNER_TEMP 'bazel.exe'
          curl.exe --fail --location --silent --show-error `
            "https://github.com/bazelbuild/bazel/releases/download/$env:BAZEL_VERSION/bazel-$env:BAZEL_VERSION-windows-x86_64.exe" `
            --output $bazel
          if ((Get-FileHash -Algorithm SHA256 $bazel).Hash.ToLowerInvariant() -ne $env:BAZEL_WINDOWS_X86_64_SHA256) {
            throw 'Bazel SHA-256 mismatch'
          }
          "BAZEL_BIN=$bazel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test compatible graph
        shell: pwsh
        env:
          CACHE_URL: >-
            ${{ (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository) &&
            vars.BAZEL_REMOTE_CACHE_URL || '' }}
        run: |
          $outputRoot = Join-Path $env:SystemDrive 'b'
          $cacheArgs = @()
          if ($env:CACHE_URL) {
            if ($env:CACHE_URL -notmatch '^https://storage\.googleapis\.com/[^/]+/gizos$') {
              throw 'BAZEL_REMOTE_CACHE_URL must use the /gizos prefix'
            }
            $cacheArgs = @(
              "--remote_cache=$($env:CACHE_URL.TrimEnd('/'))",
              '--google_default_credentials',
              '--remote_timeout=60',
              '--remote_retries=5',
              '--remote_upload_local_results=true',
              '--disk_cache='
            )
          }
          & $env:BAZEL_BIN "--output_user_root=$outputRoot" build @cacheArgs --config=windows_x86_64 --lockfile_mode=off --remote_download_outputs=minimal //...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:BAZEL_BIN "--output_user_root=$outputRoot" test @cacheArgs --config=windows_x86_64 --lockfile_mode=off --remote_download_outputs=minimal //...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Bazel repository cache seed
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.bazel-repository-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: ${{ steps.bazel-repository-cache.outputs.cache-primary-key }}

  ci-required:
    if: always()
    name: CI required
    timeout-minutes: 5
    needs:
      - bk7258-compatible-graph
      - extended-platforms
      - legacy-firmware
      - private-dependencies
      - host
      - esp-compatible-graph
      - windows-compatible-graph
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    steps:
      - name: Require every applicable execution class
        env:
          HOST_RESULT: ${{ needs.host.result }}
          BK7258_RESULT: ${{ needs.bk7258-compatible-graph.result }}
          ESP_RESULT: ${{ needs.esp-compatible-graph.result }}
          EXTENDED_RESULT: ${{ needs.extended-platforms.result }}
          LEGACY_FIRMWARE_RESULT: ${{ needs.legacy-firmware.result }}
          PRIVATE_DEPENDENCIES_RESULT: ${{ needs.private-dependencies.result }}
          PRIVATE_DEPENDENCIES_REQUIRED: >-
            ${{ github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository }}
          WINDOWS_RESULT: ${{ needs.windows-compatible-graph.result }}
        shell: bash
        run: |
          test "$HOST_RESULT" = success
          test "$EXTENDED_RESULT" = success
          test "$WINDOWS_RESULT" = success
          if [ "$PRIVATE_DEPENDENCIES_REQUIRED" = true ]; then
            test "$PRIVATE_DEPENDENCIES_RESULT" = success
            test "$BK7258_RESULT" = success
            test "$ESP_RESULT" = success
            test "$LEGACY_FIRMWARE_RESULT" = success
          else
            test "$PRIVATE_DEPENDENCIES_RESULT" = skipped
            test "$BK7258_RESULT" = skipped
            test "$ESP_RESULT" = skipped
            test "$LEGACY_FIRMWARE_RESULT" = skipped
          fi
