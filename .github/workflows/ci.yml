        shell: bash
        run: CCACHE_DIR="$H2_NATIVE_CCACHE_RUNTIME_ROOT/cache/${{ matrix.config }}" "$H2_NATIVE_CCACHE_RUNTIME_ROOT/bin/ccache" --show-stats

      - name: Save Bazel repository cache seed
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.bazel-repository-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
