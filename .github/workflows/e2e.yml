name: Live E2E

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Live E2E scope
        required: true
        default: all
        type: choice
        options: [all, pal, gizclaw]
      entry:
        description: GizClaw service entry
        required: true
        default: ap
        type: choice
        options: [ap, bj]
      suite:
        description: GizClaw suite
        required: true
        default: all
        type: choice
        options: [all, connectivity, rpc, firmware, voice, concurrency]
      backend:
        description: WebRTC PAL backend
        required: true
        default: h2peer
        type: choice
        options: [h2peer, pion, both]

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  BAZEL_VERSION: "9.2.0"

jobs:
  e2e:
    name: ${{ matrix.name }} / ${{ inputs.scope }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ${{ vars.FIRMWARE_LINUX_RUNNER }}
            bazel_config: linux_x86_64
            bazel_asset: linux-x86_64
            bazel_sha256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
          - name: macOS arm64
            runner: ${{ vars.FIRMWARE_MACOS_RUNNER }}
            bazel_config: macos_arm64
            bazel_asset: darwin-arm64
            bazel_sha256: dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          submodules: false
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libssl-dev nasm ninja-build pkg-config ripgrep

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config ripgrep

      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Validate Bazel remote cache variables
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          NATIVE_CACHE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        shell: bash
        run: |
          configured=0
          for value in "$CACHE_PROJECT" "$CACHE_URL" "$CACHE_PROVIDER" "$CACHE_WRITER"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo 'Bazel remote cache is not provisioned; using the job-local disk cache.'
          elif [ "$configured" -ne 4 ]; then
            echo 'Bazel remote cache repository variables are incomplete.' >&2
            exit 1
          elif [[ ! "$CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/gizos$ ]]; then
            echo 'BAZEL_REMOTE_CACHE_URL must be https://storage.googleapis.com/<bucket>/gizos.' >&2
            exit 1
          fi
          if [ -n "$NATIVE_CACHE_URL" ]; then
            if [ "$configured" -ne 4 ]; then
              echo 'Native ccache GCS requires the Bazel cache WIF variables.' >&2
              exit 1
            fi
            if [[ ! "$NATIVE_CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/ccache$ ]]; then
              echo 'NATIVE_CCACHE_GCS_BASE_URL must be https://storage.googleapis.com/<bucket>/ccache.' >&2
              exit 1
            fi
            native_bucket=${NATIVE_CACHE_URL#https://storage.googleapis.com/}
            native_bucket=${native_bucket%/ccache}
            bazel_bucket=${CACHE_URL#https://storage.googleapis.com/}
            bazel_bucket=${bazel_bucket%/gizos}
            if [ "$native_bucket" != "$bazel_bucket" ]; then
              echo 'Native ccache and Bazel remote cache must use isolated prefixes in the same bucket.' >&2
              exit 1
            fi
          fi

      - name: Authenticate Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Restore Bazel repository cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bazel/repository
          key: bazel-repository-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.BAZEL_VERSION }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}

      - name: Install and verify Bazel
        shell: bash
        run: |
          set -euo pipefail
          bazel_path="$RUNNER_TEMP/bazel"
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-${{ matrix.bazel_asset }}" --output "$bazel_path"
          test "$(shasum -a 256 "$bazel_path" | awk '{print $1}')" = "${{ matrix.bazel_sha256 }}"
          chmod +x "$bazel_path"

      - name: Configure Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        shell: bash
        run: |
          {
            printf 'BAZEL_REMOTE_CACHE_URL=%s\n' '${{ vars.BAZEL_REMOTE_CACHE_URL }}'
            printf 'BAZEL_REMOTE_CACHE_MODE=write\n'
            printf 'BAZEL_DISK_CACHE_MODE=off\n'
          } >> "$GITHUB_ENV"

      - name: Run selected live E2E
        env:
          E2E_SCOPE: ${{ inputs.scope }}
          H2_BAZEL_CONFIG: ${{ matrix.bazel_config }}
          H2_GIZCLAW_E2E_ENTRY: ${{ inputs.entry }}
          H2_GIZCLAW_E2E_REGISTRATION_TOKEN: ${{ secrets.H2_GIZCLAW_E2E_REGISTRATION_TOKEN }}
          H2_GIZCLAW_E2E_SUITE: ${{ inputs.suite }}
        run: |
          run_gizclaw_target() {
            make "$1" \
              BAZEL_BIN="$RUNNER_TEMP/bazel" \
              BAZEL_CONFIG="${{ matrix.bazel_config }}"
          }
          run_gizclaw() {
            case "${{ inputs.backend }}" in
              h2peer)
                run_gizclaw_target bazel-test-gizclaw_h2peer_live_test
                ;;
              pion)
                case "${{ inputs.suite }}" in rpc|firmware|voice) ;; *) return 2 ;; esac
                run_gizclaw_target bazel-test-gizclaw_pion_live_test
                ;;
              both)
                case "${{ inputs.suite }}" in firmware|voice) ;; *) return 2 ;; esac
                final_rc=0
                run_gizclaw_target bazel-test-gizclaw_h2peer_live_test || final_rc=$?
                run_gizclaw_target bazel-test-gizclaw_pion_live_test || final_rc=$?
                return "$final_rc"
                ;;
              *) return 2 ;;
            esac
          }
          case "$E2E_SCOPE" in
            all) make bazel-test-mqtt_public_broker_smoke BAZEL_BIN="$RUNNER_TEMP/bazel" BAZEL_CONFIG="${{ matrix.bazel_config }}"; run_gizclaw ;;
            pal) make bazel-test-mqtt_public_broker_smoke BAZEL_BIN="$RUNNER_TEMP/bazel" BAZEL_CONFIG="${{ matrix.bazel_config }}" ;;
            gizclaw) run_gizclaw ;;
            *) printf 'unsupported live E2E scope: %s\n' "$E2E_SCOPE" >&2; exit 2 ;;
          esac
