name: H2Loader npm package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/h2loader-npm-publish.yml"
      - "projects/h2loader/libs/web/**"
      - "projects/h2loader/targets/npm_package/h2loader/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: h2loader-npm-${{ github.ref }}
  cancel-in-progress: false

env:
  BAZEL_VERSION: "9.2.0"
  BAZEL_LINUX_X86_64_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
  PACKAGE_LABEL: //projects/h2loader/targets/npm_package/h2loader:h2loader
  PACKAGE_NAME: "@gizclaw/h2loader"
  PACKAGE_JSON: projects/h2loader/targets/npm_package/h2loader/package.json

jobs:
  publish:
    name: Publish missing version
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.11.1"
          registry-url: https://npm.pkg.github.com
          scope: "@gizclaw"

      - id: package
        name: Check committed package version
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./$PACKAGE_JSON').name")
          package_version=$(node -p "require('./$PACKAGE_JSON').version")
          test "$package_name" = "$PACKAGE_NAME"
          node -e 'const version = require("./" + process.env.PACKAGE_JSON).version; if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$/.test(version)) process.exit(1)'

          set +e
          view_output=$(npm view "$package_name@$package_version" version --json 2>&1)
          view_status=$?
          set -e
          if [ "$view_status" -eq 0 ]; then
            test "$(printf '%s' "$view_output" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => console.log(JSON.parse(value)))')" = "$package_version"
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            printf 'Version %s is already published; nothing to do.\n' "$package_version"
          elif printf '%s' "$view_output" | grep --quiet 'E404'; then
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            printf 'Version %s is missing and will be published.\n' "$package_version"
          else
            printf '%s\n' "$view_output" >&2
            exit "$view_status"
          fi

      - name: Install Bazel
        if: steps.package.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"

      - name: Build and validate package
        if: steps.package.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bazel" build --config=linux_x86_64 "$PACKAGE_LABEL"
          "$RUNNER_TEMP/bazel" run --config=linux_x86_64 "$PACKAGE_LABEL.publish" -- \
            --dry-run \
            --ignore-scripts

      - name: Publish package
        if: steps.package.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/bazel" run --config=linux_x86_64 "$PACKAGE_LABEL.publish" -- \
            --access public \
            --registry https://npm.pkg.github.com
