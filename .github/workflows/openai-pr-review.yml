name: OpenAI PR Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: openai-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@codex')
    name: Publish pending OpenAI eligibility
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      pull_request_number: ${{ steps.status.outputs.pull_request_number }}
      base_sha: ${{ steps.status.outputs.base_sha }}
      head_sha: ${{ steps.status.outputs.head_sha }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - id: status
        name: Publish exact-head pending status
        env:
          ELIGIBILITY_STATUS_MODE: start
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRUSTED_SOURCE_SHA: ${{ github.sha }}
        run: node .github/scripts/merge-eligibility-status/run.mjs

  review:
    needs: prepare
    permissions:
      actions: write
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: GizClaw/github-workflows/.github/workflows/codex-openai-review.yml@cff6ec446b57dff4cd682dd8539bc6de79f516c4
    with:
      model: gpt-5.6-terra
      effort: medium
      max-diff-bytes: 4000000
      chunk-target-bytes: 180000
      pull_request_number: ${{ needs.prepare.outputs.pull_request_number }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      head_sha: ${{ needs.prepare.outputs.head_sha }}
      review-instructions: >-
        Review only the pull-request diff. Follow the repository ownership,
        public-contract, portability, lifecycle, security, and validation
        requirements. Report only actionable correctness, regression, and
        test-coverage findings introduced by the pull request.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  finalize:
    needs: [prepare, review]
    if: always() && needs.prepare.result == 'success'
    name: Publish final OpenAI eligibility
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Publish exact-head final status
        env:
          ELIGIBILITY_STATUS_MODE: finish
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          EXPECTED_REVIEW_WORKFLOW_SHA: cff6ec446b57dff4cd682dd8539bc6de79f516c4
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PULL_REQUEST_NUMBER: ${{ needs.prepare.outputs.pull_request_number }}
          READINESS_EVIDENCE: ${{ needs.review.outputs.readiness }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: node .github/scripts/merge-eligibility-status/run.mjs
