name: Ownership Approval Review Request

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  request:
    if: github.event.pull_request.base.ref == 'main'
    name: Request ownership reevaluation
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Signal trusted evaluator
        run: echo "A review changed; the default-branch workflow will reevaluate ownership."
