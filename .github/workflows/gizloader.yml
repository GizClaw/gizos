name: Gizloader

on:
  pull_request:
    paths:
      - ".github/workflows/gizloader.yml"
      - "tools/gizloader/**"
      - "tools/gizos/**"
      - "projects/h2loader/**"
      - "libs/**"
      - "tools/bazel/**"
      - "MODULE.bazel*"
      - ".bazelrc"
      - ".bazelversion"
  push:
    branches: [main]
    tags: ["gizloader-v*"]
    paths:
      - ".github/workflows/gizloader.yml"
      - "tools/gizloader/**"
      - "tools/gizos/**"
      - "projects/h2loader/**"
      - "libs/**"
      - "tools/bazel/**"
      - "MODULE.bazel*"
      - ".bazelrc"
      - ".bazelversion"
  workflow_dispatch:
    inputs:
      channel:
        description: Build artifacts only, rolling snapshot, or immutable stable release
        type: choice
        options: [build, snapshot, release]
        default: build
      version:
        description: Optional semver override (snapshot defaults to 0.1.0-snapshot.<run>)
        type: string
        default: ""
      publish_npm_bootstrap:
        description: Explicitly publish the public gizos bootstrap to npmjs (release channel only)
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publications so the rolling tag/index cannot race another run.
concurrency:
  group: gizloader-${{ github.event.pull_request.number || 'publication' }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "24"
  BAZEL_VERSION: "9.2.0"

jobs:
  identity:
    name: Resolve build and publication identity
    runs-on: ${{ vars.GIZLOADER_LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      publish: ${{ steps.identity.outputs.publish }}
      publish_npm: ${{ steps.identity.outputs.publish_npm }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: identity
        name: Gate public channels to main and stable tags
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_NPM: ${{ inputs.publish_npm_bootstrap }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { validateReleaseIdentity } from './tools/gizloader/scripts/release-index.mjs';
          const event = process.env.GITHUB_EVENT_NAME;
          const ref = process.env.GITHUB_REF;
          const tagged = ref.startsWith('refs/tags/gizloader-v');
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const baseVersion = JSON.parse(readFileSync('tools/gizloader/package.json', 'utf8')).version;
          let channel = event === 'pull_request' ? 'build' : tagged ? 'release' : 'snapshot';
          if (event === 'workflow_dispatch') channel = process.env.INPUT_CHANNEL || 'build';
          let version = process.env.INPUT_VERSION || (tagged ? ref.slice('refs/tags/gizloader-v'.length) : baseVersion);
          if (channel === 'snapshot' && !process.env.INPUT_VERSION) version = `${baseVersion.split('-')[0]}-snapshot.${process.env.GITHUB_RUN_NUMBER}`;
          validateReleaseIdentity({ version, channel, commit });
          const publish = channel !== 'build';
          if (publish && ref !== 'refs/heads/main' && !tagged) throw new Error('Public Gizloader builds must use main or gizloader-v<version>');
          if (publish && spawnSync('git', ['merge-base', '--is-ancestor', commit, 'origin/main']).status !== 0) throw new Error('Public source commit must be reachable from main');
          if (tagged && (channel !== 'release' || ref !== `refs/tags/gizloader-v${version}`)) throw new Error('Stable tag must match the release version and channel');
          const tag = channel === 'release' ? `gizloader-v${version}` : channel === 'snapshot' ? 'gizloader-snapshot' : '';
          if (channel === 'release') {
            const existing = spawnSync('git', ['rev-parse', '--verify', '--quiet', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' });
            if (existing.status === 0 && existing.stdout.trim() !== commit) throw new Error('Stable Gizloader tags are immutable and already identify another commit');
            if (existing.status !== 0 && existing.status !== 1) throw new Error('Could not inspect existing stable tag');
          }
          const publishNpm = event === 'workflow_dispatch' && process.env.INPUT_PUBLISH_NPM === 'true';
          if (publishNpm && channel !== 'release') throw new Error('npm bootstrap publication requires the explicit release channel');
          for (const [key, value] of Object.entries({ version, channel, commit, tag, publish, publish_npm: publishNpm })) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Gizloader ${version}: ${channel}, source ${commit}.\n\n${publish ? 'Public macOS artifacts require Developer ID signing, notarization, and stapling. Missing Apple secrets fail the job; no unsigned fallback.' : 'Build artifacts only; no GitHub Release or npm publication.'}\n\nThe public gizos npm bootstrap is ${publishNpm ? 'explicitly requested, subject to its separate publication gate' : 'an artifact only; npm publication was not requested'}.\n`);
          NODE

  frontend:
    name: UI, browser fixtures, and release metadata tests
    needs: identity
    runs-on: ${{ vars.GIZLOADER_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen dependencies and build UI
        run: |
          bun install --cwd tools/gizloader --frozen-lockfile
          bun run --cwd tools/gizloader build
      - name: Test release metadata contract
        run: bun run --cwd tools/gizloader test
      - name: Install Chromium
        working-directory: tools/gizloader
        run: bunx playwright install --with-deps chromium
      - name: Exercise desktop browser fixtures
        working-directory: tools/gizloader
        shell: bash
        run: |
          set -euo pipefail
          bun run dev > "$RUNNER_TEMP/gizloader-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          for (let attempt = 0; ; attempt++) {
            try { if ((await fetch('http://127.0.0.1:4176/desktop/loader.html')).ok) break; } catch {}
            if (attempt === 79) throw new Error('Gizloader Vite server did not become ready');
            await setTimeout(250);
          }
          NODE
          bunx playwright test --config playwright.config.ts
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gizloader-browser-results
          path: tools/gizloader/release/test-results/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native installer / ${{ matrix.platform }}
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: ${{ vars.GIZLOADER_MACOS_RUNNER || 'macos-15' }}
            target: aarch64-apple-darwin
            bazel_asset: darwin-arm64
            bazel_sha256: dd466352a3e4d3581b8898740ee1ff208866ccbe25f8d367c5dcb950219587e6
            suffix: macos-arm64.dmg
          - platform: win32-x64
            runner: ${{ vars.GIZLOADER_WINDOWS_RUNNER || 'windows-2025' }}
            target: x86_64-pc-windows-msvc
            bazel_asset: windows-x86_64.exe
            bazel_sha256: 5fc2f2805b8c697a54732558576938d06bab63aa0f9b6610cc01d2cae0388705
            suffix: windows-x64-setup.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GIZLOADER_VERSION: ${{ needs.identity.outputs.version }}
      GIZLOADER_CHANNEL: ${{ needs.identity.outputs.channel }}
      GIZLOADER_COMMIT: ${{ needs.identity.outputs.commit }}
      RUSTFLAGS: ${{ matrix.platform == 'win32-x64' && '-C target-feature=+crt-static' || '' }}
    steps:
      - name: Enable Windows checkout symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Check native runner architecture
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_PLATFORM) throw new Error("Runner does not match the Gizloader artifact platform")'
      - name: Require Apple signing and notarization secrets for public macOS
        if: runner.os == 'macOS' && needs.identity.outputs.publish == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node --input-type=module <<'NODE'
          const required = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_API_KEY_CONTENT', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER'];
          const missing = required.filter(key => !process.env[key]);
          if (missing.length) throw new Error(`Public macOS publication is blocked: configure GitHub secrets ${missing.join(', ')}. A local Developer ID identity does not provision GitHub signing. Unsigned fallback is forbidden.`);
          NODE
      - name: Configure Windows MSVC and SDK environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC x64 build tools are required' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          $variables = & cmd.exe /s /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize MSVC and Windows SDK' }
          foreach ($line in $variables) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $key = $Matches[1]
            $value = $Matches[2]
            if ($key -ieq 'PATH') {
              [string[]]$directories = $value.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
              [array]::Reverse($directories)
              $directories | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } elseif ($key -in @('INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VSINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion')) {
              "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          "BAZEL_VC=$(Join-Path $installation 'VC')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $toolsLine = $variables | Where-Object { $_ -match '^VCToolsInstallDir=' } | Select-Object -First 1
          if (-not $toolsLine) { throw 'MSVC tool directory was not reported by vcvars64' }
          $linker = Join-Path $toolsLine.Substring('VCToolsInstallDir='.Length) 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $linker)) { throw 'MSVC link.exe is missing' }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install verified Bazel 9.2
        shell: bash
        env:
          BAZEL_ASSET: ${{ matrix.bazel_asset }}
          BAZEL_SHA256: ${{ matrix.bazel_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gizloader-tools"
          tool="$RUNNER_TEMP/gizloader-tools/bazel"
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          curl --fail --location --retry 3 "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-$BAZEL_ASSET" --output "$tool"
          TOOL_PATH="$tool" node --input-type=module -e 'import { readFileSync } from "node:fs"; import { createHash } from "node:crypto"; if (createHash("sha256").update(readFileSync(process.env.TOOL_PATH)).digest("hex") !== process.env.BAZEL_SHA256) throw new Error("Bazel SHA-256 mismatch")'
          chmod +x "$tool"
          printf '%s\n' "$RUNNER_TEMP/gizloader-tools" >> "$GITHUB_PATH"
      - name: Build pinned native sidecars and frontend
        shell: bash
        run: |
          set -euo pipefail
          bun install --cwd tools/gizloader --frozen-lockfile
          node tools/gizloader/scripts/prepare-native.mjs
          bun run --cwd tools/gizloader build
      - name: Test Rust supervisor
        run: cargo test --manifest-path tools/gizloader/src-tauri/Cargo.toml
      # APPLE_CERTIFICATE is a base64 PKCS#12, APPLE_API_KEY_CONTENT is plaintext
      # p8. The runner-local identity cannot substitute for any of these secrets.
      - name: Import temporary Developer ID keychain and notarization key
        if: runner.os == 'macOS' && needs.identity.outputs.publish == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, chmodSync, mkdtempSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { randomBytes } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          if (!/^Developer ID Application: .+ \([A-Z0-9]{10}\)$/.test(process.env.APPLE_SIGNING_IDENTITY)) throw new Error('APPLE_SIGNING_IDENTITY must be a Developer ID Application identity');
          if (!/^[A-Z0-9]{10}$/.test(process.env.APPLE_API_KEY_ID)) throw new Error('Invalid Apple API key ID');
          if (!process.env.APPLE_API_KEY_CONTENT.includes('-----BEGIN PRIVATE KEY-----')) throw new Error('APPLE_API_KEY_CONTENT must be a plaintext p8 private key');
          const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'gizloader-signing-'));
          chmodSync(directory, 0o700);
          appendFileSync(process.env.GITHUB_ENV, `GIZLOADER_SIGNING_DIR=${directory}\n`);
          function security(...args) {
            try { return execFileSync('security', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }); }
            catch { throw new Error(`security ${args[0]} failed while preparing the temporary signing keychain`); }
          }
          const original = [...security('list-keychains', '-d', 'user').matchAll(/"([^"\n]+)"/g)].map(match => match[1]);
          writeFileSync(join(directory, 'original-keychains.json'), JSON.stringify(original), { mode: 0o600 });
          const certificate = join(directory, 'developer-id.p12');
          const key = join(directory, `AuthKey_${process.env.APPLE_API_KEY_ID}.p8`);
          const keychain = join(directory, 'gizloader.keychain-db');
          writeFileSync(certificate, Buffer.from(process.env.APPLE_CERTIFICATE, 'base64'), { mode: 0o600 });
          writeFileSync(key, process.env.APPLE_API_KEY_CONTENT, { mode: 0o600 });
          const password = randomBytes(32).toString('hex');
          console.log(`::add-mask::${password}`);
          security('create-keychain', '-p', password, keychain);
          security('set-keychain-settings', '-lut', '21600', keychain);
          security('unlock-keychain', '-p', password, keychain);
          security('import', certificate, '-k', keychain, '-P', process.env.APPLE_CERTIFICATE_PASSWORD, '-T', '/usr/bin/codesign', '-T', '/usr/bin/security');
          security('set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', password, keychain);
          security('list-keychains', '-d', 'user', '-s', keychain, ...original);
          if (!security('find-identity', '-v', '-p', 'codesigning', keychain).includes(`"${process.env.APPLE_SIGNING_IDENTITY}"`)) throw new Error('Imported certificate does not contain the configured valid Developer ID identity');
          appendFileSync(process.env.GITHUB_ENV, `APPLE_API_KEY=${key}\n`);
          NODE
      - name: Build and verify platform installer
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && needs.identity.outputs.publish == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && needs.identity.outputs.publish == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && needs.identity.outputs.publish == 'true' && secrets.APPLE_API_ISSUER || '' }}
        run: node tools/gizloader/scripts/package.mjs --channel "$GIZLOADER_CHANNEL"
      - name: Smoke test macOS DMG import and installed CLI launcher
        if: runner.os == 'macOS'
        run: bun tools/gizloader/scripts/verify-macos-install.ts
      - name: Smoke test silent Windows installation and installed CLI launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "tools/gizloader/release/gizloader-$env:GIZLOADER_VERSION-windows-x64-setup.exe").Path
          $install = Join-Path $env:LOCALAPPDATA 'Programs\Gizloader'
          if (Test-Path (Join-Path $install 'gizloader.exe')) { throw 'Installer smoke test requires a clean per-user Gizloader installation' }
          try {
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Silent installer failed with $($process.ExitCode)" }
            foreach ($file in @('gizloader.exe', 'gizloader-cli.exe', 'gizloader-session.exe', 'gizloader.cmd')) {
              if (-not (Test-Path (Join-Path $install $file) -PathType Leaf)) { throw "Missing installed root file: $file" }
            }
            function Assert-InstalledHelp([string]$name, [string[]]$arguments) {
              $stdout = Join-Path $env:RUNNER_TEMP "$name.stdout"
              $stderr = Join-Path $env:RUNNER_TEMP "$name.stderr"
              $program = Start-Process -FilePath (Join-Path $install $name) -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              if ($program.ExitCode -ne 0) { throw "$name help failed with $($program.ExitCode): $(Get-Content $stderr -Raw)" }
              $help = Get-Content $stdout -Raw
              if ($help -notmatch '\bscan\b' -or $help -notmatch '\bpackage\b') { throw "$name did not forward native help to stdout" }
            }
            Assert-InstalledHelp 'gizloader.exe' @('--cli', '--help')
            Assert-InstalledHelp 'gizloader-cli.exe' @('--help')
            $cmdHelp = & (Join-Path $install 'gizloader.cmd') --help 2>&1
            if ($LASTEXITCODE -ne 0 -or ($cmdHelp -join "`n") -notmatch '\bscan\b') { throw 'Installed gizloader.cmd did not return native help successfully' }
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            if (-not ($userPath.Split(';') | Where-Object { $_.TrimEnd('\') -ieq $install.TrimEnd('\') })) { throw 'Installer did not register the per-user command PATH' }
          } finally {
            $uninstaller = Join-Path $install 'uninstall.exe'
            if (Test-Path $uninstaller) {
              $removed = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
              if ($removed.ExitCode -ne 0) { throw "Silent uninstall failed with $($removed.ExitCode)" }
              if (Test-Path (Join-Path $install 'gizloader.exe')) { throw 'Silent uninstall left the application installed' }
            }
          }
      - name: Delete temporary Apple credentials and restore keychain search list
        if: always() && runner.os == 'macOS'
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const directory = process.env.GIZLOADER_SIGNING_DIR;
          if (directory) {
            let failed = false;
            const original = join(directory, 'original-keychains.json');
            try {
              if (existsSync(original)) execFileSync('security', ['list-keychains', '-d', 'user', '-s', ...JSON.parse(readFileSync(original, 'utf8'))], { stdio: 'ignore' });
            } catch { failed = true; }
            try {
              const keychain = join(directory, 'gizloader.keychain-db');
              if (existsSync(keychain)) execFileSync('security', ['delete-keychain', keychain], { stdio: 'ignore' });
            } catch { failed = true; }
            finally { rmSync(directory, { recursive: true, force: true }); }
            if (failed) throw new Error('Temporary Apple signing material was removed, but keychain restoration or deletion failed');
          }
          NODE
      - name: Save installer and individual metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gizloader-native-${{ matrix.platform }}
          path: |
            tools/gizloader/release/gizloader-${{ needs.identity.outputs.version }}-${{ matrix.suffix }}
            tools/gizloader/release/gizloader-${{ matrix.platform }}.metadata.json
          if-no-files-found: error
          retention-days: 14

  bootstrap:
    name: Build public gizos npm bootstrap artifact
    needs: identity
    runs-on: ${{ vars.GIZLOADER_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    env:
      GIZLOADER_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build and pack the public alias
        shell: bash
        run: |
          set -euo pipefail
          bun install --cwd tools/gizos --frozen-lockfile
          bun tools/gizos/build.ts --output tools/gizos/dist-public --package-name gizos --version "$GIZLOADER_VERSION"
          mkdir -p tools/gizloader/bootstrap
          npm pack ./tools/gizos/dist-public --ignore-scripts --pack-destination tools/gizloader/bootstrap
      - name: Save npm tarball without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gizloader-gizos-bootstrap
          path: tools/gizloader/bootstrap/gizos-${{ needs.identity.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Verify and publish dedicated Gizloader release
    if: needs.identity.outputs.publish == 'true'
    needs: [identity, frontend, native, bootstrap]
    runs-on: ${{ vars.GIZLOADER_LINUX_RUNNER || 'ubuntu-24.04' }}
    environment: gizloader-release
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GIZLOADER_VERSION: ${{ needs.identity.outputs.version }}
      GIZLOADER_CHANNEL: ${{ needs.identity.outputs.channel }}
      GIZLOADER_COMMIT: ${{ needs.identity.outputs.commit }}
      GIZLOADER_TAG: ${{ needs.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gizloader-native-*
          merge-multiple: true
          path: tools/gizloader/release
      - name: Assemble and verify exact desktop artifacts
        run: |
          node tools/gizloader/scripts/release-index.mjs assemble --directory tools/gizloader/release
          node tools/gizloader/scripts/release-index.mjs verify --directory tools/gizloader/release
      - name: Save verified desktop release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gizloader-release-${{ needs.identity.outputs.version }}
          path: |
            tools/gizloader/release/*.dmg
            tools/gizloader/release/*.exe
            tools/gizloader/release/gizloader-index.json
            tools/gizloader/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Preserve stable identity or replace rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdtemp, rm } from 'node:fs/promises';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { verifyRelease } from './tools/gizloader/scripts/release-index.mjs';
          const repository = process.env.GITHUB_REPOSITORY;
          const tag = process.env.GIZLOADER_TAG;
          const version = process.env.GIZLOADER_VERSION;
          const channel = process.env.GIZLOADER_CHANNEL;
          const commit = process.env.GIZLOADER_COMMIT;
          const directory = 'tools/gizloader/release';
          const options = { version, channel, commit };
          const index = await verifyRelease({ ...options, directory });
          const files = [...index.artifacts.map(artifact => artifact.file), 'gizloader-index.json', 'SHA256SUMS'].sort();
          async function api(path, method = 'GET', body) {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${repository}/${path}`, {
              method,
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body && { 'Content-Type': 'application/json' }) },
              ...(body && { body: JSON.stringify(body) }),
            });
            if (method === 'GET' && response.status === 404) return null;
            if (!response.ok) throw new Error(`GitHub ${method} ${path} failed (${response.status})`);
            return response.status === 204 ? null : response.json();
          }
          function gh(...args) { execFileSync('gh', args, { stdio: 'inherit' }); }
          async function verifyPublished(release) {
            if (JSON.stringify(release.assets.map(asset => asset.name).sort()) !== JSON.stringify(files)) throw new Error('Published release assets do not exactly match the desktop bundle');
            const downloaded = await mkdtemp(join(process.env.RUNNER_TEMP, 'gizloader-release-verify-'));
            try {
              gh('release', 'download', tag, '--repo', repository, '--dir', downloaded, ...files.flatMap(file => ['--pattern', file]));
              await verifyRelease({ ...options, directory: downloaded });
            } finally { await rm(downloaded, { recursive: true, force: true }); }
          }
          const ref = await api(`git/ref/tags/${encodeURIComponent(tag)}`);
          let object = ref?.object;
          for (let depth = 0; object?.type === 'tag' && depth < 10; depth++) object = (await api(`git/tags/${object.sha}`))?.object;
          if (channel === 'release' && object && (object.type !== 'commit' || object.sha !== commit)) throw new Error('Stable tag already identifies another commit; it will not be moved');
          const existing = await api(`releases/tags/${encodeURIComponent(tag)}`);
          if (channel === 'release' && existing) {
            if (existing.draft || existing.prerelease) throw new Error('Existing stable release is draft/prerelease; resolve it manually without replacing a published version');
            await verifyPublished(existing);
            console.log(`Stable ${tag} is already published for this version and source; preserving all existing assets.`);
            process.exit(0);
          }
          if (channel === 'snapshot' && existing) await api(`releases/${existing.id}`, 'DELETE');
          if (!ref) await api('git/refs', 'POST', { ref: `refs/tags/${tag}`, sha: commit });
          else if (channel === 'snapshot') await api(`git/refs/tags/${encodeURIComponent(tag)}`, 'PATCH', { sha: commit, force: true });
          const release = await api('releases', 'POST', {
            tag_name: tag, target_commitish: commit,
            name: channel === 'snapshot' ? `Gizloader snapshot ${version}` : `Gizloader ${version}`,
            body: `Gizloader ${version}\n\nSource: ${commit}\n\nmacOS Apple Silicon: Developer ID signed, notarized, and stapled. Windows x64 NSIS: currently unsigned. Signing state, sizes, and SHA-256 hashes are recorded in gizloader-index.json; SHA256SUMS covers the index and installers.\n\nThe public gizos npm bootstrap is built separately. This desktop release does not imply npm publication.`,
            draft: true, prerelease: channel === 'snapshot', make_latest: 'false',
          });
          gh('release', 'upload', tag, '--repo', repository, ...files.map(file => join(directory, file)));
          await verifyPublished(await api(`releases/${release.id}`));
          await api(`releases/${release.id}`, 'PATCH', { draft: false, make_latest: 'false' });
          console.log(`Published ${channel} release ${tag} after downloading and verifying its complete desktop bundle.`);
          NODE

  npm-bootstrap:
    name: Explicit public npm bootstrap publication
    if: needs.identity.outputs.publish_npm == 'true'
    needs: [identity, bootstrap, release]
    runs-on: ${{ vars.GIZLOADER_LINUX_RUNNER || 'ubuntu-24.04' }}
    environment: gizloader-npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GIZLOADER_VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gizloader-gizos-bootstrap
          path: bootstrap
      # Configure npm trusted publishing for this workflow and gizloader-npm
      # environment, then set GIZLOADER_NPM_TRUSTED_PUBLISHING=true; alternatively
      # provide NPM_TOKEN. Neither configuration enables this explicit input.
      - name: Check configured authentication and publish missing public version
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.GIZLOADER_NPM_TRUSTED_PUBLISHING }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          const registry = 'https://registry.npmjs.org/';
          if (process.env.NPM_TRUSTED_PUBLISHING !== 'true' && !process.env.NODE_AUTH_TOKEN) throw new Error('npm publication was requested, but neither GIZLOADER_NPM_TRUSTED_PUBLISHING=true nor NPM_TOKEN is configured');
          const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (npmVersion[0] < 11 || (npmVersion[0] === 11 && (npmVersion[1] < 5 || (npmVersion[1] === 5 && npmVersion[2] < 1)))) throw new Error('Trusted publishing requires npm 11.5.1 or later');
          const version = process.env.GIZLOADER_VERSION;
          const tarball = `bootstrap/gizos-${version}.tgz`;
          const manifest = JSON.parse(execFileSync('tar', ['-xOf', tarball, 'package/package.json'], { encoding: 'utf8' }));
          if (manifest.name !== 'gizos' || manifest.version !== version || manifest.publishConfig?.registry !== registry) throw new Error('Bootstrap tarball must contain the expected public gizos name, version, and npmjs registry');
          const existing = spawnSync('npm', ['view', `gizos@${version}`, 'version', '--json', '--registry', registry], { encoding: 'utf8' });
          let state;
          if (existing.status === 0) {
            if (JSON.parse(existing.stdout) !== version) throw new Error('Unexpected existing npm package version');
            state = `gizos@${version} already exists on npmjs; it was preserved and no publish was performed.`;
          } else {
            let code;
            try { code = JSON.parse(existing.stdout).error?.code; } catch {}
            if (code !== 'E404' && !/\bE404\b/.test(existing.stderr)) throw new Error('npm registry lookup failed; publication was not attempted');
            execFileSync('npm', ['publish', tarball, '--access', 'public', '--registry', registry, '--ignore-scripts', '--provenance'], { stdio: 'inherit' });
            state = `Published gizos@${version} to npmjs using the explicit bootstrap publication gate.`;
          }
          console.log(state);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${state}\n`);
          NODE
