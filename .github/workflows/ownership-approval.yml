name: Ownership Approval

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_run:
    workflows: [Ownership Approval Review Request]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: ownership-approval-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.pull_requests[0].head.sha }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request_review' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0].base.ref == 'main')
    name: Publish ownership approval
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Check out trusted pull-request base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.workflow_run.pull_requests[0].base.sha }}

      - name: Evaluate trusted-author or CODEOWNERS approval policy
        id: policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/ownership-approval/run.mjs
