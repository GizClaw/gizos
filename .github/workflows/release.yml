name: Release

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and upload the verified bundle as an Actions artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-release
  cancel-in-progress: false

env:
  BAZEL_VERSION: "9.2.0"
  BAZEL_LINUX_X86_64_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
  BK7258_SDK_COMMIT: 6bbf62746a5e904a508dee056cac6b17675637f5
  BK7258_PYTHON_VERSION: "3.11"

jobs:
  catalog:
    name: Release catalog
    runs-on: gizclaw-orbstack-amd64
    timeout-minutes: 60
    outputs:
      batch: ${{ steps.batch.outputs.value }}
      tag: ${{ steps.batch.outputs.tag }}
    steps:
      - name: Require default branch release ref
        if: ${{ !inputs.build_only }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Release must run from $DEFAULT_BRANCH (got $GITHUB_REF)" >&2
            exit 1
          fi

      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Require exact release snapshot
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          if [[ "$BUILD_ONLY" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/* ]]
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          else
            python3 tools/bazel/release/release_workflow.py gate \
              --ref "$GITHUB_REF" --default-branch "$DEFAULT_BRANCH" \
              --commit "$GITHUB_SHA"
          fi

      - name: Generate UTC release batch
        id: batch
        run: |
          [[ "$GITHUB_REF" == refs/heads/* ]]
          batch=$(date -u +%Y%m%d-%H%M%S)
          [[ "$batch" =~ ^[0-9]{8}-[0-9]{6}$ ]]
          printf 'value=%s\n' "$batch" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$batch" >> "$GITHUB_OUTPUT"

      - name: Install Bazel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error "https://releases.bazel.build/$BAZEL_VERSION/release/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"
          python3 -I tools/bazel/repositories/prefetch.py

      - name: Build in-repository gizos command
        shell: bash
        run: |
          "$RUNNER_TEMP/bazel" build --config=linux_x86_64 //tools/gizos:gizos
          printf 'GIZOS_BIN=%s/tools/gizos/gizos.sh\n' "$(realpath bazel-bin)" >> "$GITHUB_ENV"
          printf 'GIZOS_DEVENV_HOME=%s/gizos-devenv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Fetch catalog-pinned ESP-IDF sources
        shell: bash
        run: |
          "$GIZOS_BIN" setup esp-idf 6.2 --sources-only
          "$GIZOS_BIN" env esp-idf 6.2 --json > "$RUNNER_TEMP/devenv-idf.json"
          python3 - <<'PYENV'
          import json, os
          item = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "devenv-idf.json")))["environments"][0]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("H2_ESP_IDF_SDK_ROOT=" + item["sdk"] + "\n")
              output.write("H2_ESP_IDF_TOOLS_ROOT=" + item["tools"] + "\n")
          PYENV

      - name: Restore ESP-IDF tool cache
        id: esp-idf-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gizos-devenv/tools/idf
          key: gizos-idf-shared-v1-${{ runner.os }}-${{ hashFiles('tools/gizos/src/catalog.json', 'tools/bazel/native/versions/esp_idf_tool_versions.txt') }}-esp32s3-esp32p4-esp32c5

      - name: Install catalog-pinned ESP-IDF tools
        shell: bash
        env:
          IDF_GITHUB_ASSETS: ""
          IDF_MIRROR_PREFIX_MAP: 'https://github\.com/espressif/binutils-gdb/,https://dl.espressif.com/github_assets/espressif/binutils-gdb/'
        run: '"$GIZOS_BIN" setup esp-idf 6.2 --targets esp32s3,esp32p4,esp32c5'

      - name: Build catalog slice
        run: |
          eval "$("$GIZOS_BIN" env esp-idf 6.2 --shell bash)"
          test "$IDF_PATH" = "$H2_ESP_IDF_SDK_ROOT"
          test "$H2LOADER_IDF_PATH" = "$IDF_PATH"
          test "$IDF_TOOLS_PATH" = "$H2_ESP_IDF_TOOLS_ROOT"
          make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=catalog RELEASE_BATCH="${{ steps.batch.outputs.value }}" RELEASE_STAGING_DIR=build/release/catalog

      - name: Build Lua runtime source slice
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=lua-runtime RELEASE_BATCH="${{ steps.batch.outputs.value }}" RELEASE_STAGING_DIR=build/release/lua-runtime

      - name: Upload Lua runtime source slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-lua-runtime
          path: build/release/lua-runtime/
          if-no-files-found: error
          retention-days: 14

      - name: Save ESP-IDF tool cache seed
        if: steps.esp-idf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gizos-devenv/tools/idf
          key: ${{ steps.esp-idf-cache.outputs.cache-primary-key }}

      - name: Upload catalog slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-catalog
          path: build/release/catalog/
          if-no-files-found: error
          retention-days: 14

  npm-packages:
    name: Release npm packages
    needs: [catalog]
    runs-on: gizclaw-orbstack-amd64
    timeout-minutes: 30
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Install Bazel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error "https://releases.bazel.build/$BAZEL_VERSION/release/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"
          python3 -I tools/bazel/repositories/prefetch.py

      - name: Build npm packages slice
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=npm-packages RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_STAGING_DIR=build/release/npm-packages

      - name: Upload npm packages slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-npm-bundle
          path: build/release/npm-packages/
          if-no-files-found: error
          retention-days: 14

  esp:
    name: Release ${{ matrix.slice }}
    needs: catalog
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: esp32s3
            runner: gizclaw-orbstack-amd64
          - slice: esp32p4
            runner: gizclaw-orbstack-amd64
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Download catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-catalog
          path: build/release/input

      - name: Install Bazel for gizos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error "https://releases.bazel.build/$BAZEL_VERSION/release/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"
          python3 -I tools/bazel/repositories/prefetch.py

      - name: Build in-repository gizos command
        shell: bash
        run: |
          "$RUNNER_TEMP/bazel" build --config=linux_x86_64 //tools/gizos:gizos
          printf 'GIZOS_BIN=%s/tools/gizos/gizos.sh\n' "$(realpath bazel-bin)" >> "$GITHUB_ENV"
          printf 'GIZOS_DEVENV_HOME=%s/gizos-devenv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Fetch catalog-pinned ESP-IDF sources
        shell: bash
        run: |
          "$GIZOS_BIN" setup esp-idf 6.2 --sources-only
          "$GIZOS_BIN" env esp-idf 6.2 --json > "$RUNNER_TEMP/devenv-idf.json"
          python3 - <<'PYENV'
          import json, os
          item = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "devenv-idf.json")))["environments"][0]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("H2_ESP_IDF_SDK_ROOT=" + item["sdk"] + "\n")
              output.write("H2_ESP_IDF_TOOLS_ROOT=" + item["tools"] + "\n")
          PYENV

      - name: Restore ESP-IDF tool cache
        id: esp-idf-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gizos-devenv/tools/idf
          key: gizos-idf-shared-v1-${{ runner.os }}-${{ hashFiles('tools/gizos/src/catalog.json', 'tools/bazel/native/versions/esp_idf_tool_versions.txt') }}-esp32s3-esp32p4-esp32c5

      - name: Install catalog-pinned ESP-IDF tools
        shell: bash
        env:
          IDF_GITHUB_ASSETS: ""
          IDF_MIRROR_PREFIX_MAP: 'https://github\.com/espressif/binutils-gdb/,https://dl.espressif.com/github_assets/espressif/binutils-gdb/'
        run: '"$GIZOS_BIN" setup esp-idf 6.2 --targets esp32s3,esp32p4,esp32c5'

      - name: Install native compiler cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=tools/bazel/native/versions/native_ccache_tools.txt
          read -r _ ccache_version ccache_sha256 ccache_url < <(awk '$1 == "ccache" { print; exit }' "$manifest")
          test "$ccache_version" = 4.13.6
          runtime_root="${CCACHE_DIR:-$RUNNER_TEMP}/native-ccache-$ccache_version"
          mkdir -p "$runtime_root/bin" "$runtime_root/cache"
          if [ ! -x "$runtime_root/bin/ccache" ]; then
            staging="$RUNNER_TEMP/native-ccache-install"
            mkdir -p "$staging"
            python3 -I tools/bazel/repositories/github_release.py "$ccache_url" "$ccache_sha256" "$staging/ccache.tar.xz"
            printf '%s  %s\n' "$ccache_sha256" "$staging/ccache.tar.xz" | sha256sum --check --strict
            tar --extract --xz --file "$staging/ccache.tar.xz" --strip-components=1 --directory "$staging"
            ccache_tmp=$(mktemp "$runtime_root/bin/.ccache.XXXXXXXX")
            install -m 0755 "$staging/ccache" "$ccache_tmp"
            mv -f "$ccache_tmp" "$runtime_root/bin/ccache"
          fi
          runtime_tmp=$(mktemp "$runtime_root/.runtime.XXXXXXXX")
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache"}\n' > "$runtime_tmp"
          mv -f "$runtime_tmp" "$runtime_root/runtime.json"
          printf 'H2_NATIVE_CCACHE_RUNTIME_ROOT=%s\n' "$runtime_root" >> "$GITHUB_ENV"

      - name: Build firmware slice
        env:
          WIFI_PASSWORD: ${{ secrets.H2LOADER_WIFI_PASSWORD }}
        run: |
          eval "$("$GIZOS_BIN" env esp-idf 6.2 --shell bash)"
          test "$IDF_PATH" = "$H2_ESP_IDF_SDK_ROOT"
          test "$H2LOADER_IDF_PATH" = "$IDF_PATH"
          test "$IDF_TOOLS_PATH" = "$H2_ESP_IDF_TOOLS_ROOT"
          credentials="$(python3 -c 'import json, os; print(json.dumps({"ssid":"HAIVIVI-MFG","password":os.environ["WIFI_PASSWORD"]}, separators=(",", ":")))')"
          export H2LOADER_WIFI_CREDENTIALS="$credentials"
          make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE="${{ matrix.slice }}" RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR="build/release/${{ matrix.slice }}"

      - name: Show native compiler cache statistics
        if: always()
        continue-on-error: true
        run: CCACHE_DIR="$H2_NATIVE_CCACHE_RUNTIME_ROOT/cache/${{ matrix.slice }}" "$H2_NATIVE_CCACHE_RUNTIME_ROOT/bin/ccache" --show-stats

      - name: Save ESP-IDF tool cache seed
        if: steps.esp-idf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/gizos-devenv/tools/idf
          key: ${{ steps.esp-idf-cache.outputs.cache-primary-key }}

      - name: Upload firmware slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.slice }}
          path: build/release/${{ matrix.slice }}/
          if-no-files-found: error
          retention-days: 14

  bk7258:
    name: Release BK7258
    needs: catalog
    runs-on: gizclaw-orbstack-amd64
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Download catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-catalog
          path: build/release/input

      - name: Set up BK7258 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BK7258_PYTHON_VERSION }}

      - name: Install BK7258 host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build
          python -m venv "$RUNNER_TEMP/bk-python"
          "$RUNNER_TEMP/bk-python/bin/python" -m pip install cbor2 click click-option-group cryptography future intelhex jinja2 pycryptodome pyserial PyYAML
          printf '%s\n' "$RUNNER_TEMP/bk-python/bin" >> "$GITHUB_PATH"

      - name: Check out BK7258 SDK fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GizClaw/bk_avdk_smp
          ref: ${{ env.BK7258_SDK_COMMIT }}
          path: .bk-sdk
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Configure BK7258 SDK, native cache, and Bazel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C .bk-sdk rev-parse HEAD)" = "$BK7258_SDK_COMMIT"
          curl --fail --location --silent --show-error "https://releases.bazel.build/$BAZEL_VERSION/release/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"
          python3 -I tools/bazel/repositories/prefetch.py
          manifest=tools/bazel/native/versions/native_ccache_tools.txt
          read -r _ ccache_version ccache_sha256 ccache_url < <(awk '$1 == "ccache" { print; exit }' "$manifest")
          test "$ccache_version" = 4.13.6
          runtime_root="${CCACHE_DIR:-$RUNNER_TEMP}/native-ccache-$ccache_version"
          mkdir -p "$runtime_root/bin" "$runtime_root/cache"
          if [ ! -x "$runtime_root/bin/ccache" ]; then
            staging="$RUNNER_TEMP/native-ccache-install"
            mkdir -p "$staging"
            python3 -I tools/bazel/repositories/github_release.py "$ccache_url" "$ccache_sha256" "$staging/ccache.tar.xz"
            printf '%s  %s\n' "$ccache_sha256" "$staging/ccache.tar.xz" | sha256sum --check --strict
            tar --extract --xz --file "$staging/ccache.tar.xz" --strip-components=1 --directory "$staging"
            ccache_tmp=$(mktemp "$runtime_root/bin/.ccache.XXXXXXXX")
            install -m 0755 "$staging/ccache" "$ccache_tmp"
            mv -f "$ccache_tmp" "$runtime_root/bin/ccache"
          fi
          runtime_tmp=$(mktemp "$runtime_root/.runtime.XXXXXXXX")
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache"}\n' > "$runtime_tmp"
          mv -f "$runtime_tmp" "$runtime_root/runtime.json"
          {
            printf 'BK7258_PATH=%s/.bk-sdk\n' "$GITHUB_WORKSPACE"
            printf 'H2_NATIVE_CCACHE_RUNTIME_ROOT=%s\n' "$runtime_root"
          } >> "$GITHUB_ENV"

      - name: Build BK7258 slice
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=bk7258 RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/bk7258

      - name: Show native compiler cache statistics
        if: always()
        continue-on-error: true
        run: CCACHE_DIR="$H2_NATIVE_CCACHE_RUNTIME_ROOT/cache/bk7258" "$H2_NATIVE_CCACHE_RUNTIME_ROOT/bin/ccache" --show-stats

      - name: Upload BK7258 slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bk7258
          path: build/release/bk7258/
          if-no-files-found: error
          retention-days: 14

  firmware-bundle:
    name: Release firmware bundle
    needs: [catalog, esp, bk7258]
    runs-on: gizclaw-orbstack-amd64
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Download catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-catalog
          path: build/release/input/catalog

      - name: Download ESP32-S3 inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-esp32s3
          path: build/release/input/esp32s3

      - name: Download ESP32-P4 inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-esp32p4
          path: build/release/input/esp32p4

      - name: Download BK7258 inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bk7258
          path: build/release/input/bk7258

      - name: Install Bazel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error "https://releases.bazel.build/$BAZEL_VERSION/release/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"
          python3 -I tools/bazel/repositories/prefetch.py

      - name: Assemble firmware bundle
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=firmware-bundle RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/firmware-bundle

      - name: Upload firmware bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-firmware-bundle
          path: build/release/firmware-bundle/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package firmware ZIP
    needs: [catalog, firmware-bundle]
    runs-on: gizclaw-orbstack-amd64
    timeout-minutes: 10
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified firmware bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-bundle
          path: build/release/input

      - name: Package deterministic firmware ZIP
        run: make bazel-release RELEASE_SLICE=package RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/package

      - name: Upload packaged firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-firmware-package
          path: build/release/package/
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    name: Complete release bundle
    needs: [catalog, package, npm-packages]
    runs-on: gizclaw-orbstack-amd64
    timeout-minutes: 30
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download packaged firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-package
          path: build/release/input/firmware

      - name: Download npm bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-npm-bundle
          path: build/release/input/npm

      - name: Download Lua runtime source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-lua-runtime
          path: build/release/input/lua

      - name: Assemble final slice
        run: make bazel-release RELEASE_SLICE=release-bundle RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/final

      - name: Verify assets and write release index
        env:
          RELEASE_TAG: ${{ needs.catalog.outputs.tag }}
        run: |
          python3 tools/bazel/release/release_workflow.py prepare \
            --directory build/release/final --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"

      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-${{ needs.catalog.outputs.batch }}
          path: build/release/final/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release bundle
    if: ${{ !inputs.build_only }}
    needs: [catalog, release-bundle]
    runs-on: gizclaw-orbstack-amd64
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download complete release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-${{ needs.catalog.outputs.batch }}
          path: build/release/final/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BATCH: ${{ needs.catalog.outputs.batch }}
          RELEASE_TAG: ${{ needs.catalog.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir=build/release/final
          python3 tools/bazel/release/release_workflow.py verify \
            --directory "$release_dir" --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          release_state() {
            local result
            if result=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft 2>&1); then
              printf '%s\n' "$result"
            elif [[ "$result" == *"HTTP 404"* ]]; then
              printf 'absent\n'
            else
              echo "::error::Unable to verify Release state for $RELEASE_TAG: $result" >&2
              return 1
            fi
          }

          tag_state() {
            local result
            if result=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '"present"' 2>&1); then
              printf '%s\n' "$result"
            elif [[ "$result" == *"HTTP 404"* ]]; then
              printf 'absent\n'
            else
              echo "::error::Unable to verify tag state for $RELEASE_TAG: $result" >&2
              return 1
            fi
          }

          cleanup() {
            cleanup_failed=0
            if ! current_release=$(release_state); then
              return 1
            fi
            if [ "$current_release" = false ]; then
              echo "::error::Release $RELEASE_TAG is already public; refusing destructive cleanup" >&2
              return 1
            fi
            if [ "$current_release" = true ]; then
              if ! gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
                echo "::error::Failed to delete draft release $RELEASE_TAG" >&2
                cleanup_failed=1
              fi
            fi

            if ! current_tag=$(tag_state); then
              return 1
            fi
            if [ "$current_tag" = present ]; then
              if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"; then
                echo "::error::Failed to delete generated tag $RELEASE_TAG" >&2
                cleanup_failed=1
              fi
            fi

            if ! current_release=$(release_state); then
              cleanup_failed=1
            elif [ "$current_release" != absent ]; then
              echo "::error::Release cleanup left $RELEASE_TAG behind" >&2
              cleanup_failed=1
            fi
            if ! current_tag=$(tag_state); then
              cleanup_failed=1
            elif [ "$current_tag" != absent ]; then
              echo "::error::Tag cleanup left $RELEASE_TAG behind" >&2
              cleanup_failed=1
            fi
            return "$cleanup_failed"
          }

          current_release=$(release_state)
          current_tag=$(tag_state)
          if [ "$current_release" != absent ] || [ "$current_tag" != absent ]; then
            echo "::error::Generated release identity already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          trap cleanup EXIT
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --generate-notes \
            --title "GizOS firmware release $RELEASE_TAG"
          find "$release_dir" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets"
          gh release upload "$RELEASE_TAG" "$release_dir"/*
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-assets"
          cmp "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/actual-release-assets"

          verify_dir=$(mktemp -d "$RUNNER_TEMP/release-verify.XXXXXX")
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          while IFS= read -r asset; do
            cmp "$release_dir/$asset" "$verify_dir/$asset"
          done < "$RUNNER_TEMP/expected-release-assets"
          python3 tools/bazel/release/release_workflow.py verify \
            --directory "$verify_dir" --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          if ! gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false; then
            test "$(release_state)" = false
          fi
          trap - EXIT
