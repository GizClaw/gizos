name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

env:
  BAZEL_VERSION: "9.2.0"
  BAZEL_LINUX_X86_64_SHA256: 7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694
  BK7258_SDK_COMMIT: aa5df964b0f64924ee6d0d2ffd6c3ca6ed59f9ca
  BK7258_PYTHON_VERSION: "3.11"
  BAZEL_REMOTE_CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
  BAZEL_REMOTE_CACHE_MODE: write

jobs:
  catalog:
    name: Release catalog
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 60
    outputs:
      batch: ${{ steps.batch.outputs.value }}
      tag: ${{ steps.batch.outputs.tag }}
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false

      - id: app-token
        name: Create read-only h2vivi token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.H2VIVI_GITHUB_APP_ID }}
          private-key: ${{ secrets.H2VIVI_GITHUB_APP_PRIVATE_KEY }}
          owner: h2vivi

      - name: Check out Firmwares devenv
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: h2vivi/firmware-devenv
          path: firmware-devenv
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out ESP-IDF from Firmwares devenv
        shell: bash
        run: git -C firmware-devenv submodule update --init --depth 1 third_party/esp_idf_6.0

      - name: Restore ESP-IDF tool cache
        id: esp-idf-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: firmware-devenv/.tools/esp-idf
          key: esp-idf-v2-${{ runner.os }}-${{ hashFiles('tools/bazel/native_versions/esp_idf_commit.txt') }}-esp32s3-esp32p4-esp32c5

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          export IDF_TOOLS_PATH="$GITHUB_WORKSPACE/firmware-devenv/.tools/esp-idf"
          firmware-devenv/third_party/esp_idf_6.0/install.sh esp32s3,esp32p4,esp32c5

      - name: Validate Bazel remote cache variables
        env:
          CACHE_PROJECT: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          CACHE_URL: ${{ vars.BAZEL_REMOTE_CACHE_URL }}
          CACHE_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          CACHE_WRITER: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          NATIVE_CACHE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        run: |
          configured=0
          for value in "$CACHE_PROJECT" "$CACHE_URL" "$CACHE_PROVIDER" "$CACHE_WRITER"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo 'Bazel remote cache repository variables are incomplete.' >&2
            exit 1
          fi
          if [ -n "$NATIVE_CACHE_URL" ]; then
            if [ "$configured" -ne 4 ]; then
              echo 'Native ccache GCS requires the Bazel cache WIF variables.' >&2
              exit 1
            fi
            if [[ ! "$NATIVE_CACHE_URL" =~ ^https://storage\.googleapis\.com/[^/]+/ccache$ ]]; then
              echo 'NATIVE_CCACHE_GCS_BASE_URL must be https://storage.googleapis.com/<bucket>/ccache.' >&2
              exit 1
            fi
            native_bucket=${NATIVE_CACHE_URL#https://storage.googleapis.com/}
            native_bucket=${native_bucket%/ccache}
            bazel_bucket=${CACHE_URL#https://storage.googleapis.com/}
            bazel_bucket=${bazel_bucket%/gizos}
            if [ "$native_bucket" != "$bazel_bucket" ]; then
              echo 'Native ccache and Bazel remote cache must use isolated prefixes in the same bucket.' >&2
              exit 1
            fi
          fi

      - name: Authenticate read-write Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Generate UTC release batch
        id: batch
        run: |
          [[ "$GITHUB_REF" == refs/heads/* ]]
          batch=$(date -u +%Y%m%d-%H%M%S)
          [[ "$batch" =~ ^[0-9]{8}-[0-9]{6}$ ]]
          printf 'value=%s\n' "$batch" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$batch" >> "$GITHUB_OUTPUT"

      - name: Install Bazel
        run: |
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"

      - name: Export ESP SDK environment
        run: |
          . firmware-devenv/export.sh
          printf 'IDF_PATH=%s\nIDF_TOOLS_PATH=%s\n' "$IDF_PATH" "$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

      - name: Set up AC791N release tools
        uses: ./.github/actions/setup-ac791n-release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Build catalog slice
        run: |
          make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=catalog RELEASE_BATCH="${{ steps.batch.outputs.value }}" RELEASE_STAGING_DIR=build/release/catalog

      - name: Save ESP-IDF tool cache seed
        if: steps.esp-idf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: firmware-devenv/.tools/esp-idf
          key: ${{ steps.esp-idf-cache.outputs.cache-primary-key }}

      - name: Upload catalog slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-catalog
          path: build/release/catalog/
          if-no-files-found: error
          retention-days: 14

  npm-packages:
    name: Release npm packages
    needs: [catalog]
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Authenticate read-write Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install Bazel
        run: |
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"

      - name: Build npm packages slice
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=npm-packages RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_STAGING_DIR=build/release/npm-packages

      - name: Upload npm packages slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-npm-bundle
          path: build/release/npm-packages/
          if-no-files-found: error
          retention-days: 14

  esp:
    name: Release ${{ matrix.slice }}
    needs: catalog
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: esp32s3
            runner: ${{ vars.FIRMWARE_LINUX_8CORE_RUNNER }}
          - slice: esp32p4
            runner: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - id: app-token
        name: Create read-only h2vivi token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.H2VIVI_GITHUB_APP_ID }}
          private-key: ${{ secrets.H2VIVI_GITHUB_APP_PRIVATE_KEY }}
          owner: h2vivi

      - name: Check out Firmwares devenv
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: h2vivi/firmware-devenv
          path: firmware-devenv
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out ESP-IDF from Firmwares devenv
        shell: bash
        run: git -C firmware-devenv submodule update --init --depth 1 third_party/esp_idf_6.0

      - name: Authenticate read-write Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Download catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-catalog
          path: build/release/input

      - name: Restore ESP-IDF tool cache
        id: esp-idf-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: firmware-devenv/.tools/esp-idf
          key: esp-idf-v2-${{ runner.os }}-${{ hashFiles('tools/bazel/native_versions/esp_idf_commit.txt') }}-esp32s3-esp32p4-esp32c5

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          export IDF_TOOLS_PATH="$GITHUB_WORKSPACE/firmware-devenv/.tools/esp-idf"
          firmware-devenv/third_party/esp_idf_6.0/install.sh esp32s3,esp32p4,esp32c5

      - name: Install native compiler cache and Bazel
        run: |
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"
          manifest=tools/bazel/native_versions/native_ccache_tools.txt
          read -r _ ccache_version ccache_sha256 ccache_url < <(awk '$1 == "ccache" { print; exit }' "$manifest")
          read -r _ helper_version helper_sha256 helper_url < <(awk '$1 == "ccache-storage-http-go" { print; exit }' "$manifest")
          test "$ccache_version" = 4.13.6
          test "$helper_version" = 0.8
          runtime_root="$RUNNER_TEMP/native-ccache-runtime"
          mkdir -p "$runtime_root/bin" "$runtime_root/cache" "$runtime_root/ccache" "$runtime_root/helper"
          curl --fail --location --silent --show-error "$ccache_url" --output "$runtime_root/ccache.tar.xz"
          printf '%s  %s\n' "$ccache_sha256" "$runtime_root/ccache.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$runtime_root/ccache.tar.xz" --strip-components=1 --directory "$runtime_root/ccache"
          curl --fail --location --silent --show-error "$helper_url" --output "$runtime_root/helper.tar.gz"
          printf '%s  %s\n' "$helper_sha256" "$runtime_root/helper.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$runtime_root/helper.tar.gz" --strip-components=1 --directory "$runtime_root/helper"
          install -m 0755 "$runtime_root/ccache/ccache" "$runtime_root/bin/ccache"
          install -m 0755 "$runtime_root/helper/ccache-storage-http" "$runtime_root/bin/ccache-storage-https"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache"}\n' > "$runtime_root/runtime.json"
          printf 'H2_NATIVE_CCACHE_RUNTIME_ROOT=%s\n' "$runtime_root" >> "$GITHUB_ENV"

      - name: Refresh native compiler cache token
        id: native-ccache-auth
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Configure native compiler cache GCS access
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != ''
        env:
          NATIVE_CCACHE_ACCESS_TOKEN: ${{ steps.native-ccache-auth.outputs.access_token }}
          NATIVE_CCACHE_GCS_BASE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        run: |
          token_file="$H2_NATIVE_CCACHE_RUNTIME_ROOT/token"
          install -m 0600 /dev/null "$token_file"
          printf '%s' "$NATIVE_CCACHE_ACCESS_TOKEN" > "$token_file"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache","remote_base_url":"%s","storage_helper":"bin/ccache-storage-https","token_file":"token"}\n' "$NATIVE_CCACHE_GCS_BASE_URL" > "$H2_NATIVE_CCACHE_RUNTIME_ROOT/runtime.json"

      - name: Build firmware slice
        env:
          WIFI_PASSWORD: ${{ secrets.H2LOADER_WIFI_PASSWORD }}
        run: |
          . firmware-devenv/export.sh
          credentials="$(python3 -c 'import json, os; print(json.dumps({"ssid":"HAIVIVI-MFG","password":os.environ["WIFI_PASSWORD"]}, separators=(",", ":")))')"
          export H2LOADER_WIFI_CREDENTIALS="$credentials"
          make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE="${{ matrix.slice }}" RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR="build/release/${{ matrix.slice }}"

      - name: Show native compiler cache statistics
        if: always()
        continue-on-error: true
        run: CCACHE_DIR="$H2_NATIVE_CCACHE_RUNTIME_ROOT/cache/${{ matrix.slice }}" "$H2_NATIVE_CCACHE_RUNTIME_ROOT/bin/ccache" --show-stats

      - name: Save ESP-IDF tool cache seed
        if: steps.esp-idf-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: firmware-devenv/.tools/esp-idf
          key: ${{ steps.esp-idf-cache.outputs.cache-primary-key }}

      - name: Upload firmware slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.slice }}
          path: build/release/${{ matrix.slice }}/
          if-no-files-found: error
          retention-days: 14

  bk7258:
    name: Release BK7258
    needs: catalog
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - id: app-token
        name: Create read-only h2vivi token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.H2VIVI_GITHUB_APP_ID }}
          private-key: ${{ secrets.H2VIVI_GITHUB_APP_PRIVATE_KEY }}
          owner: h2vivi

      - name: Authenticate read-write Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Download catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-catalog
          path: build/release/input

      - name: Set up BK7258 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.BK7258_PYTHON_VERSION }}

      - name: Install BK7258 host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build
          python -m venv "$RUNNER_TEMP/bk-python"
          "$RUNNER_TEMP/bk-python/bin/python" -m pip install cbor2 click click-option-group cryptography future intelhex jinja2 pycryptodome pyserial PyYAML
          printf '%s\n' "$RUNNER_TEMP/bk-python/bin" >> "$GITHUB_PATH"

      - name: Check out BK7258 SDK mirror
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: h2vivi/bk-avdk-smp
          ref: ${{ env.BK7258_SDK_COMMIT }}
          path: .bk-sdk
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure BK7258 SDK, native cache, and Bazel
        run: |
          test "$(git -C .bk-sdk rev-parse HEAD)" = "$BK7258_SDK_COMMIT"
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"
          manifest=tools/bazel/native_versions/native_ccache_tools.txt
          read -r _ ccache_version ccache_sha256 ccache_url < <(awk '$1 == "ccache" { print; exit }' "$manifest")
          read -r _ helper_version helper_sha256 helper_url < <(awk '$1 == "ccache-storage-http-go" { print; exit }' "$manifest")
          test "$ccache_version" = 4.13.6
          test "$helper_version" = 0.8
          runtime_root="$RUNNER_TEMP/native-ccache-runtime"
          mkdir -p "$runtime_root/bin" "$runtime_root/cache" "$runtime_root/ccache" "$runtime_root/helper"
          curl --fail --location --silent --show-error "$ccache_url" --output "$runtime_root/ccache.tar.xz"
          printf '%s  %s\n' "$ccache_sha256" "$runtime_root/ccache.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$runtime_root/ccache.tar.xz" --strip-components=1 --directory "$runtime_root/ccache"
          curl --fail --location --silent --show-error "$helper_url" --output "$runtime_root/helper.tar.gz"
          printf '%s  %s\n' "$helper_sha256" "$runtime_root/helper.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$runtime_root/helper.tar.gz" --strip-components=1 --directory "$runtime_root/helper"
          install -m 0755 "$runtime_root/ccache/ccache" "$runtime_root/bin/ccache"
          install -m 0755 "$runtime_root/helper/ccache-storage-http" "$runtime_root/bin/ccache-storage-https"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache"}\n' > "$runtime_root/runtime.json"
          {
            printf 'BK7258_PATH=%s/.bk-sdk\n' "$GITHUB_WORKSPACE"
            printf 'H2_NATIVE_CCACHE_RUNTIME_ROOT=%s\n' "$runtime_root"
          } >> "$GITHUB_ENV"

      - name: Refresh native compiler cache token
        id: native-ccache-auth
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Configure native compiler cache GCS access
        if: vars.NATIVE_CCACHE_GCS_BASE_URL != ''
        env:
          NATIVE_CCACHE_ACCESS_TOKEN: ${{ steps.native-ccache-auth.outputs.access_token }}
          NATIVE_CCACHE_GCS_BASE_URL: ${{ vars.NATIVE_CCACHE_GCS_BASE_URL }}
        run: |
          token_file="$H2_NATIVE_CCACHE_RUNTIME_ROOT/token"
          install -m 0600 /dev/null "$token_file"
          printf '%s' "$NATIVE_CCACHE_ACCESS_TOKEN" > "$token_file"
          printf '{"schema":"h2.native-ccache-runtime.v1","ccache":"bin/ccache","cache_root":"cache","remote_base_url":"%s","storage_helper":"bin/ccache-storage-https","token_file":"token"}\n' "$NATIVE_CCACHE_GCS_BASE_URL" > "$H2_NATIVE_CCACHE_RUNTIME_ROOT/runtime.json"

      - name: Build BK7258 slice
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=bk7258 RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/bk7258

      - name: Show native compiler cache statistics
        if: always()
        continue-on-error: true
        run: CCACHE_DIR="$H2_NATIVE_CCACHE_RUNTIME_ROOT/cache/bk7258" "$H2_NATIVE_CCACHE_RUNTIME_ROOT/bin/ccache" --show-stats

      - name: Upload BK7258 slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bk7258
          path: build/release/bk7258/
          if-no-files-found: error
          retention-days: 14

  ac791n:
    name: Release AC791N
    needs: catalog
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 120
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - id: app-token
        name: Create read-only h2vivi token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.H2VIVI_GITHUB_APP_ID }}
          private-key: ${{ secrets.H2VIVI_GITHUB_APP_PRIVATE_KEY }}
          owner: h2vivi

      - name: Set up AC791N release tools
        uses: ./.github/actions/setup-ac791n-release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Bazel
        run: |
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"

      - name: Authenticate read-write Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Download catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-catalog
          path: build/release/input

      - name: Build AC791N release slice
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=ac791n RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/ac791n

      - name: Upload AC791N slice
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ac791n
          path: build/release/ac791n/
          if-no-files-found: error
          retention-days: 14

  firmware-bundle:
    name: Release firmware bundle
    needs: [catalog, esp, bk7258, ac791n]
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false

      - name: Authenticate read-write Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      # Download only firmware producers; release-npm-bundle belongs to the final job.
      # Keep artifact directories separate so duplicate basenames fail validation.
      - name: Download catalog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-catalog
          path: build/release/input/catalog

      - name: Download ESP32-S3 inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-esp32s3
          path: build/release/input/esp32s3

      - name: Download ESP32-P4 inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-esp32p4
          path: build/release/input/esp32p4

      - name: Download BK7258 inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bk7258
          path: build/release/input/bk7258

      - name: Download AC791N inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-ac791n
          path: build/release/input/ac791n

      - name: Install Bazel
        run: |
          curl --fail --location --silent --show-error "https://github.com/bazelbuild/bazel/releases/download/$BAZEL_VERSION/bazel-$BAZEL_VERSION-linux-x86_64" --output "$RUNNER_TEMP/bazel"
          printf '%s  %s\n' "$BAZEL_LINUX_X86_64_SHA256" "$RUNNER_TEMP/bazel" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bazel"

      - name: Assemble firmware bundle
        run: make bazel-release BAZEL_BIN="$RUNNER_TEMP/bazel" RELEASE_SLICE=firmware-bundle RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/firmware-bundle

      - name: Upload firmware bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-firmware-bundle
          path: build/release/firmware-bundle/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package firmware ZIP
    needs: [catalog, firmware-bundle]
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download verified firmware bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-bundle
          path: build/release/input

      - name: Package deterministic firmware ZIP
        run: make bazel-release RELEASE_SLICE=package RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/package

      - name: Upload packaged firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-firmware-package
          path: build/release/package/
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    name: Complete release bundle
    needs: [catalog, package, npm-packages]
    runs-on: ${{ vars.FIRMWARE_LINUX_RUNNER }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out GizOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate read-write Bazel remote cache
        if: vars.BAZEL_REMOTE_CACHE_URL != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.BAZEL_CACHE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZEL_CACHE_WRITER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Download packaged firmware
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-package
          path: build/release/input/firmware

      - name: Download npm bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-npm-bundle
          path: build/release/input/npm

      - name: Assemble final slice
        run: make bazel-release RELEASE_SLICE=release-bundle RELEASE_BATCH="${{ needs.catalog.outputs.batch }}" RELEASE_INPUT_DIR=build/release/input RELEASE_STAGING_DIR=build/release/final

      - name: Upload complete release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-${{ needs.catalog.outputs.batch }}
          path: build/release/final/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BATCH: ${{ needs.catalog.outputs.batch }}
          RELEASE_TAG: ${{ needs.catalog.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir=build/release/final
          release_state() {
            local result
            if result=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft 2>&1); then
              printf '%s\n' "$result"
            elif [[ "$result" == *"HTTP 404"* ]]; then
              printf 'absent\n'
            else
              echo "::error::Unable to verify Release state for $RELEASE_TAG: $result" >&2
              return 1
            fi
          }

          tag_state() {
            local result
            if result=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '"present"' 2>&1); then
              printf '%s\n' "$result"
            elif [[ "$result" == *"HTTP 404"* ]]; then
              printf 'absent\n'
            else
              echo "::error::Unable to verify tag state for $RELEASE_TAG: $result" >&2
              return 1
            fi
          }

          cleanup() {
            cleanup_failed=0
            if ! current_release=$(release_state); then
              return 1
            fi
            if [ "$current_release" = false ]; then
              echo "::error::Release $RELEASE_TAG is already public; refusing destructive cleanup" >&2
              return 1
            fi
            if [ "$current_release" = true ]; then
              if ! gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; then
                echo "::error::Failed to delete draft release $RELEASE_TAG" >&2
                cleanup_failed=1
              fi
            fi

            if ! current_tag=$(tag_state); then
              return 1
            fi
            if [ "$current_tag" = present ]; then
              if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"; then
                echo "::error::Failed to delete generated tag $RELEASE_TAG" >&2
                cleanup_failed=1
              fi
            fi

            if ! current_release=$(release_state); then
              cleanup_failed=1
            elif [ "$current_release" != absent ]; then
              echo "::error::Release cleanup left $RELEASE_TAG behind" >&2
              cleanup_failed=1
            fi
            if ! current_tag=$(tag_state); then
              cleanup_failed=1
            elif [ "$current_tag" != absent ]; then
              echo "::error::Tag cleanup left $RELEASE_TAG behind" >&2
              cleanup_failed=1
            fi
            return "$cleanup_failed"
          }

          current_release=$(release_state)
          current_tag=$(tag_state)
          if [ "$current_release" != absent ] || [ "$current_tag" != absent ]; then
            echo "::error::Generated release identity already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          trap cleanup EXIT
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --generate-notes \
            --title "GizOS firmware release $RELEASE_TAG"
          find "$release_dir" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets"
          gh release upload "$RELEASE_TAG" "$release_dir"/*
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-assets"
          cmp "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/actual-release-assets"

          verify_dir=$(mktemp -d "$RUNNER_TEMP/release-verify.XXXXXX")
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          while IFS= read -r asset; do
            cmp "$release_dir/$asset" "$verify_dir/$asset"
          done < "$RUNNER_TEMP/expected-release-assets"
          publish_options=(--draft=false)
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            publish_options+=(--prerelease --latest=false)
          fi
          if ! gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${publish_options[@]}"; then
            test "$(release_state)" = false
          fi
          trap - EXIT
