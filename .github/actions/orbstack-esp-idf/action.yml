name: Set up ESP-IDF on OrbStack
description: Verify the catalog-pinned SDK and reuse its tools on the local CI disk
inputs:
  targets:
    description: Comma-separated ESP-IDF targets
    required: true
runs:
  using: composite
  steps:
    - name: Prepare the pinned SDK and tools
      shell: bash
      env:
        ESP_IDF_TARGETS: ${{ inputs.targets }}
        IDF_GITHUB_ASSETS: ""
        IDF_MIRROR_PREFIX_MAP: 'https://github\.com/espressif/binutils-gdb/,https://dl.espressif.com/github_assets/espressif/binutils-gdb/'
      run: |
        sdk_root=/ci-cache/esp-idf
        sdk_version=6.2
        sdk_commit=$(jq -er --arg version "$sdk_version" '.sdks[] | select(.name == "esp-idf" and .version == $version) | .commit' tools/gizos/src/catalog.json)
        [[ "$sdk_commit" =~ ^[0-9a-f]{40}$ ]]
        sdk_path="$sdk_root/sources/$sdk_commit"
        tools_path="$sdk_root/tools/$RUNNER_ARCH/$sdk_commit"
        mkdir -p "$sdk_root/sources" "$tools_path"
        exec {sdk_lock}>"$sdk_path.lock"
        flock --timeout 1200 "$sdk_lock"
        "$GIZOS_BIN" setup esp-idf "$sdk_version" --sdk "$sdk_path" --tools "$tools_path" --targets "$ESP_IDF_TARGETS"
        printf 'H2_ESP_IDF_SDK_ROOT=%s\nH2_ESP_IDF_TOOLS_ROOT=%s\n' "$sdk_path" "$tools_path" >> "$GITHUB_ENV"
