  <path d="M46 344Q184 266 322 344" class="guide"/>
  <g transform="translate(64 325) rotate(-25)"><rect width="20" height="10" rx="3" fill="#ffc64d"/></g>
  <g transform="translate(90 313) rotate(-19)"><rect width="20" height="10" rx="3" fill="#ffc64d"/></g>
  <g transform="translate(118 303) rotate(-13)"><rect width="20" height="10" rx="3" fill="#ffc64d"/></g>
  <g transform="translate(148 297) rotate(-6)"><rect width="20" height="10" rx="3" fill="#ffc64d"/></g>
  <g transform="translate(179 295)"><rect width="20" height="10" rx="3" fill="#18262c" stroke="#566b74"/></g>
  <g transform="translate(210 297) rotate(6)"><rect width="20" height="10" rx="3" fill="#18262c" stroke="#566b74"/></g>
  <g transform="translate(240 303) rotate(13)"><rect width="20" height="10" rx="3" fill="#18262c" stroke="#566b74"/></g>
  <g transform="translate(268 313) rotate(19)"><rect width="20" height="10" rx="3" fill="#18262c" stroke="#566b74"/></g>
  <g transform="translate(294 325) rotate(25)"><rect width="20" height="10" rx="3" fill="#18262c" stroke="#566b74"/></g>
  <g transform="translate(318 341) rotate(31)"><rect width="20" height="10" rx="3" fill="#18262c" stroke="#566b74"/></g>
  <text x="184" y="320" text-anchor="middle" class="label">聚气 4 / 10</text>

  <!-- carousel -->
  <path d="M0 384Q184 302 368 384V448H0Z" fill="#03090e" stroke="#164354" stroke-width="2"/>
