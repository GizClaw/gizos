  <!-- first person hands -->
  <path d="M22 292L47 238 75 216 92 226 83 249 105 269 109 292Z" fill="#0b1821" stroke="#24d9ff" stroke-width="2"/>
  <path d="M346 292L321 238 293 216 276 226 285 249 263 269 259 292Z" fill="#0b1821" stroke="#24d9ff" stroke-width="2"/>
