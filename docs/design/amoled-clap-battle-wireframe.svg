<svg xmlns="http://www.w3.org/2000/svg" width="736" height="896" viewBox="0 0 368 448">
  <defs>
    <linearGradient id="fadeLeft" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="1" x2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <style>
      .label { font: 10px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #d7f8ff; }
      .small { font: 8px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #7e9aa6; }
      .guide { fill: none; stroke: #275363; stroke-width: 1; stroke-dasharray: 3 3; }
    </style>
  </defs>

  <rect width="368" height="448" rx="26" fill="#000"/>
