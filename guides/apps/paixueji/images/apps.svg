    <circle cx="48" cy="32" r="5" fill="#ffd66f"/>
    <path d="M22 53l12-12 9 8 7-6 9 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="90" y="213" text-anchor="middle" fill="#403752" font-family="system-ui, 'PingFang SC', sans-serif" font-size="18" font-weight="600">作品</text>

  <g transform="translate(200 105)" filter="url(#iconShadow)">
    <rect width="80" height="80" rx="24" fill="#ae78df"/>
    <path d="M50 18c-15 4-24 16-22 30 2 10 9 17 19 20-18 2-34-11-35-29-1-17 12-31 29-32 3 0 6 0 9 1z" fill="#fff"/>
    <path d="M58 25l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffe587"/>
