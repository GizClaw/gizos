<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">拍学机应用页</title>
  <desc id="desc">全屏应用页使用三列网格排列十二个应用图标，包括打电话、我的角色、探索、音乐、魔拍、聊天、收藏、安全和设置，可以继续向下滚动。</desc>
  <defs>
    <linearGradient id="background" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.52" stop-color="#f7ebff"/>
      <stop offset="1" stop-color="#ded9ff"/>
    </linearGradient>
    <filter id="iconShadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#44377f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="480" height="800" fill="url(#background)"/>
  <circle cx="-6" cy="94" r="130" fill="#ffd6b8" opacity="0.22"/>
  <circle cx="482" cy="337" r="150" fill="#c4b7ff" opacity="0.2"/>

  <g transform="translate(24 28)">
