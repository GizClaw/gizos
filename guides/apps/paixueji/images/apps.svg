    <rect x="31" y="36" width="18" height="16" rx="4" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M35 36v-4c0-7 10-7 10 0v4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
