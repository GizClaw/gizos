    <path d="M40 16l6 7 9-1 3 9 8 5-4 9 2 9-9 4-6 8-9-4-9 4-6-8-9-4 2-9-4-9 8-5 3-9 9 1z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="40" cy="41" r="10" fill="none" stroke="#fff" stroke-width="4"/>
  </g>
  <text x="390" y="687" text-anchor="middle" fill="#403752" font-family="system-ui, 'PingFang SC', sans-serif" font-size="18" font-weight="600">设置</text>

  <rect x="468" y="119" width="4" height="470" rx="2" fill="#7769a5" opacity="0.12"/>
  <rect x="468" y="119" width="4" height="150" rx="2" fill="#7769a5" opacity="0.46"/>
</svg>
