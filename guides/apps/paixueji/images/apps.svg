    <path d="M29 16l-9 9 9 9" fill="none" stroke="#4b4261" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="240" y="64" text-anchor="middle" fill="#352d54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="26" font-weight="700">应用</text>

  <!-- Row 1 -->
  <g transform="translate(50 105)" filter="url(#iconShadow)">
    <rect width="80" height="80" rx="24" fill="#7965e9"/>
