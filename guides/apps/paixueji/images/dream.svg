<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">梦境生成器</title><desc id="desc">孩子和当前角色对话描述想象，生成梦境图片并自动保存到作品。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#30275f"/><stop offset=".55" stop-color="#7559b5"/><stop offset="1" stop-color="#d48abb"/></linearGradient><radialGradient id="moon"><stop stop-color="#fff"/><stop offset="1" stop-color="#ffe7a5"/></radialGradient></defs><rect width="480" height="800" fill="url(#bg)"/>
  <circle cx="380" cy="128" r="82" fill="url(#moon)" opacity=".9"/><circle cx="78" cy="190" r="3" fill="#fff"/><circle cx="187" cy="91" r="4" fill="#fff"/><circle cx="428" cy="302" r="3" fill="#fff"/><path d="M111 119l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fff"/>
  <circle cx="42" cy="52" r="24" fill="#fff" opacity=".18"/><path d="M47 42l-10 10 10 10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="61" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="750">梦境</text>
  <g font-family="system-ui,'PingFang SC',sans-serif"><rect x="25" y="213" width="430" height="280" rx="35" fill="#fff" opacity=".9"/><text x="52" y="255" fill="#746684" font-size="15">告诉小拍，你想梦见什么？</text><text x="52" y="307" fill="#3e334b" font-size="22" font-weight="700">我想和小拍一起，</text><text x="52" y="341" fill="#3e334b" font-size="22" font-weight="700">坐月亮船去看星星……</text><circle cx="389" cy="425" r="36" fill="#7358d7"/><path d="M389 405v27M379 418c0 14 20 14 20 0M373 431c8 12 24 12 32 0M389 443v10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="52" y="398" width="145" height="47" rx="23" fill="#eee9ff"/><circle cx="78" cy="421" r="16" fill="#7863e5"/><text x="104" y="427" fill="#51446a" font-size="15" font-weight="650">和小拍创作</text></g>
  <rect x="25" y="523" width="430" height="74" rx="28" fill="#fff" opacity=".18"/><text x="240" y="555" text-anchor="middle" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="650">开始生成梦境</text><text x="240" y="580" text-anchor="middle" fill="#eadff5" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">生成结果会自动保存到作品</text>
  <text x="25" y="647" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="700">最近的梦</text>
  <g transform="translate(25 665)"><rect width="130" height="108" rx="24" fill="#9f84dd"/><path d="M91 20c-29 7-36 45-10 60-30 1-46-24-39-48 6-19 28-29 49-22z" fill="#fff"/><text x="18" y="97" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">月亮船</text></g><g transform="translate(175 665)"><rect width="130" height="108" rx="24" fill="#e5a191"/><circle cx="65" cy="47" r="26" fill="#ffe788"/><text x="18" y="97" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">云上城堡</text></g><g transform="translate(325 665)"><rect width="130" height="108" rx="24" fill="#66afa4"/><path d="M65 19l10 22 24 3-18 16 5 24-21-12-21 12 5-24-18-16 24-3z" fill="#fff"/><text x="18" y="97" fill="#fff" font-family="system-ui,'PingFang SC',sans-serif" font-size="13">海底星空</text></g>
</svg>
