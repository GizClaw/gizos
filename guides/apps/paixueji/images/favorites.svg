<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">收藏剪贴簿</title><desc id="desc">收藏页保存对话卡片、照片、魔拍和梦境图片，并保留原内容来源。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff8ed"/><stop offset="1" stop-color="#f1dff3"/></linearGradient></defs><rect width="480" height="800" fill="url(#bg)"/>
  <circle cx="42" cy="52" r="24" fill="#fff" opacity=".76"/><path d="M47 42l-10 10 10 10" fill="none" stroke="#4b4052" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="61" fill="#382d42" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="750">收藏</text>
  <text x="25" y="113" fill="#75677c" font-family="system-ui,'PingFang SC',sans-serif" font-size="15">我的数字剪贴簿 · 18 项</text>
  <g font-family="system-ui,'PingFang SC',sans-serif">
    <g transform="translate(25 139) rotate(-2 127 110)"><rect width="255" height="224" rx="26" fill="#fff"/><circle cx="43" cy="45" r="23" fill="#7964e6"/><rect x="30" y="36" width="26" height="20" rx="9" fill="#3a2c75"/><circle cx="39" cy="46" r="3" fill="#fff"/><circle cx="48" cy="46" r="3" fill="#fff"/><text x="77" y="40" fill="#776d7d" font-size="13">小拍 · 对话卡片</text><text x="23" y="94" fill="#372d40" font-size="18" font-weight="700">“月亮不是自己发光，</text><text x="23" y="121" fill="#372d40" font-size="18" font-weight="700">它把太阳光送给我们。”</text><path d="M21 165h213" stroke="#eee7ef" stroke-width="2"/><text x="23" y="195" fill="#8a7d8c" font-size="13">来自：一起做一艘月亮船</text><path d="M218 185l7 7 13-16" fill="none" stroke="#e76e8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(301 139) rotate(2 77 110)"><rect width="154" height="224" rx="26" fill="#9dcaae"/><circle cx="117" cy="48" r="27" fill="#ffdf78"/><path d="M0 145l48-49 42 36 32-27 32 28v91H0z" fill="#5e9670"/><text x="17" y="197" fill="#fff" font-size="14" font-weight="650">公园的下午</text></g>
    <g transform="translate(25 389) rotate(1.5 98 150)"><rect width="196" height="295" rx="27" fill="#8d75d9"/><path d="M131 40c-43 11-53 69-13 91-45 3-72-35-60-70 10-29 41-46 73-38z" fill="#fff" opacity=".9"/><path d="M151 48l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffe480"/><path d="M0 207c57-50 118-45 196 19v69H0z" fill="#4d3d91" opacity=".7"/><text x="18" y="265" fill="#fff" font-size="15">梦境</text><text x="18" y="287" fill="#fff" font-size="18" font-weight="700">月亮船</text></g>
    <g transform="translate(241 389) rotate(-1 107 150)"><rect width="214" height="143" rx="27" fill="#fff"/><rect x="18" y="18" width="72" height="72" rx="20" fill="#f3a383"/><circle cx="57" cy="54" r="23" fill="#fff" opacity=".7"/><text x="108" y="43" fill="#847788" font-size="13">图片裁剪</text><text x="108" y="70" fill="#403445" font-size="17" font-weight="700">小拍在花园</text><text x="108" y="96" fill="#847788" font-size="13">来自魔拍作品</text><path d="M177 112l7 7 13-16" fill="none" stroke="#e76e8b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(241 552)"><rect width="214" height="132" rx="27" fill="#fff" opacity=".82"/><text x="22" y="38" fill="#847788" font-size="13">世界徽章</text><circle cx="56" cy="82" r="30" fill="#86c3a0"/><path d="M44 90c5-21 25-25 33-7-6 12-18 16-33 7z" fill="#fff"/><text x="100" y="78" fill="#403445" font-size="17" font-weight="700">鸟类观察员</text><text x="100" y="102" fill="#847788" font-size="13">来自探索</text></g>
  </g>
</svg>
