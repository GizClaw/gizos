  <rect x="25" y="608" width="430" height="114" rx="30" fill="#fff" opacity=".8"/><circle cx="80" cy="665" r="33" fill="#e976a5"/><path d="M74 646v34c0 7-13 8-13 0s8-9 13-6v-23l24-5v25c0 7-13 8-13 0s8-9 13-6v-24z" fill="#fff"/><text x="130" y="651" fill="#74697d" font-family="system-ui,'PingFang SC',sans-serif" font-size="14">可以直接对小拍说</text><text x="130" y="681" fill="#3e344a" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="700">“播放一首睡前音乐”</text>
