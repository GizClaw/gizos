<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">听音乐与 AI 创作音乐</title><desc id="desc">音乐页既可连接第三方曲库听音乐，也可以与 AI 共同创作音乐并保存到作品。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff3f8"/><stop offset="1" stop-color="#dfddff"/></linearGradient><linearGradient id="hero" x2="1" y2="1"><stop stop-color="#e66f9f"/><stop offset="1" stop-color="#875dd7"/></linearGradient></defs><rect width="480" height="800" fill="url(#bg)"/>
  <circle cx="42" cy="52" r="24" fill="#fff" opacity=".76"/><path d="M47 42l-10 10 10 10" fill="none" stroke="#493e58" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="61" fill="#352b43" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="750">音乐</text>
  <g font-family="system-ui,'PingFang SC',sans-serif" font-size="16" text-anchor="middle"><rect x="25" y="91" width="430" height="50" rx="25" fill="#fff" opacity=".8"/><rect x="29" y="95" width="211" height="42" rx="21" fill="#df679b"/><text x="135" y="122" fill="#fff" font-weight="700">听音乐</text><text x="346" y="122" fill="#665772" font-weight="650">AI 创作</text></g>
  <rect x="25" y="161" width="430" height="205" rx="35" fill="url(#hero)"/>
  <g font-family="system-ui,'PingFang SC',sans-serif"><text x="52" y="201" fill="#f8eafa" font-size="14">第三方音乐服务</text><text x="52" y="239" fill="#fff" font-size="25" font-weight="750">连接家庭音乐账号</text><text x="52" y="269" fill="#f6e8f9" font-size="15">使用家长手机扫码授权</text><rect x="52" y="293" width="173" height="45" rx="23" fill="#fff"/><text x="139" y="322" text-anchor="middle" fill="#7650bd" font-size="16" font-weight="700">连接音乐服务</text></g>
  <g transform="translate(327 200)"><rect width="84" height="84" rx="16" fill="#fff"/><path d="M11 11h20v7H18v13h-7zM73 11H53v7h13v13h7zM11 73h20v-7H18V53h-7zM73 73H53v-7h13V53h7z" fill="#4a3d68"/><rect x="33" y="33" width="18" height="18" fill="#7d5cce"/></g>
  <text x="25" y="414" fill="#3d3349" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="720">推荐歌单</text>
  <g font-family="system-ui,'PingFang SC',sans-serif">
    <g transform="translate(25 434)"><rect width="130" height="157" rx="27" fill="#f29ab4"/><circle cx="65" cy="61" r="31" fill="#fff" opacity=".9"/><path d="M59 42v35c0 8-14 9-14 0 0-8 8-9 14-6V49l23-6v25c0 8-14 9-14 0 0-8 8-9 14-6V38z" fill="#e66c98"/><text x="18" y="128" fill="#fff" font-size="16" font-weight="700">快乐起床</text><text x="18" y="148" fill="#fff" font-size="12">12 首</text></g>
    <g transform="translate(175 434)"><rect width="130" height="157" rx="27" fill="#7f70dc"/><circle cx="65" cy="61" r="31" fill="#fff" opacity=".9"/><path d="M73 39c-22 5-29 34-9 45-23 2-36-17-30-35 5-16 23-24 39-19z" fill="#7861cf"/><text x="18" y="128" fill="#fff" font-size="16" font-weight="700">安静入睡</text><text x="18" y="148" fill="#fff" font-size="12">18 首</text></g>
    <g transform="translate(325 434)"><rect width="130" height="157" rx="27" fill="#58aea3"/><circle cx="65" cy="61" r="31" fill="#fff" opacity=".9"/><path d="M44 63c7-25 34-31 43-7-8 17-25 22-43 7z" fill="#4a9d91"/><text x="18" y="128" fill="#fff" font-size="16" font-weight="700">自然声音</text><text x="18" y="148" fill="#fff" font-size="12">10 首</text></g>
