<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">拍学机纯角色首页</title>
  <desc id="desc">柔和背景中是名叫小拍的当前角色，左上角显示角色名，右上角是隐藏菜单。</desc>
  <defs>
    <linearGradient id="sky" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.5" stop-color="#f6eaff"/>
      <stop offset="1" stop-color="#ddd8ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.55" stop-color="#e9e4ff"/>
      <stop offset="1" stop-color="#ae9af3"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5949bc"/>
      <stop offset="1" stop-color="#241b54"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcadff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#705cda" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="characterShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="22" stdDeviation="23" flood-color="#34286d" flood-opacity="0.25"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="480" height="800" fill="url(#sky)"/>
  <circle cx="5" cy="126" r="170" fill="#ffd6b8" opacity="0.28"/>
  <circle cx="488" cy="212" r="188" fill="#c4b7ff" opacity="0.3"/>
  <circle cx="238" cy="392" r="258" fill="url(#halo)"/>
  <path d="M-34 636C82 566 168 602 242 656c72 53 164 78 275 0v194H-34z" fill="url(#floor)"/>
  <circle cx="87" cy="621" r="82" fill="#ffffff" opacity="0.16" filter="url(#blur)"/>
  <circle cx="410" cy="588" r="98" fill="#f8ccff" opacity="0.16" filter="url(#blur)"/>

  <text x="32" y="61" fill="#352d54" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="27" font-weight="700" letter-spacing="1">小拍</text>

  <g transform="translate(400 31)">
    <circle cx="25" cy="25" r="25" fill="#ffffff" opacity="0.64"/>
    <circle cx="18" cy="25" r="2.5" fill="#514967"/>
    <circle cx="25" cy="25" r="2.5" fill="#514967"/>
    <circle cx="32" cy="25" r="2.5" fill="#514967"/>
  </g>

  <g filter="url(#characterShadow)" transform="translate(74 160)">
    <ellipse cx="166" cy="456" rx="137" ry="34" fill="#49399a" opacity="0.16"/>
    <path d="M117 67c0-31 22-53 49-53s49 22 49 53" fill="none" stroke="#7560e8" stroke-width="11" stroke-linecap="round"/>
    <circle cx="166" cy="12" r="11" fill="#ffc95c"/>
    <rect x="43" y="62" width="246" height="276" rx="115" fill="url(#body)"/>
    <rect x="68" y="110" width="196" height="132" rx="65" fill="url(#visor)"/>
    <ellipse cx="127" cy="169" rx="11" ry="15" fill="#ffffff"/>
    <ellipse cx="205" cy="169" rx="11" ry="15" fill="#ffffff"/>
    <path d="M130 201c23 21 49 21 72 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="91" cy="179" rx="18" ry="10" fill="#ff9ab3" opacity="0.52"/>
    <ellipse cx="241" cy="179" rx="18" ry="10" fill="#ff9ab3" opacity="0.52"/>
    <path d="M50 263c-33 12-49 37-43 68" fill="none" stroke="#a997ef" stroke-width="25" stroke-linecap="round"/>
    <path d="M282 263c33 12 49 37 43 68" fill="none" stroke="#a997ef" stroke-width="25" stroke-linecap="round"/>
    <path d="M109 325l-20 101" fill="none" stroke="#8f7be2" stroke-width="40" stroke-linecap="round"/>
    <path d="M223 325l20 101" fill="none" stroke="#8f7be2" stroke-width="40" stroke-linecap="round"/>
    <circle cx="89" cy="429" r="29" fill="#fffefa"/>
    <circle cx="243" cy="429" r="29" fill="#fffefa"/>
    <circle cx="166" cy="292" r="27" fill="#ffffff" opacity="0.86"/>
    <path d="M156 292l7 7 15-18" fill="none" stroke="#725be9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="69" cy="286" r="7" fill="#ffffff" opacity="0.55"/>
    <circle cx="269" cy="286" r="7" fill="#ffffff" opacity="0.55"/>
  </g>

  <g fill="#ffffff" opacity="0.65">
    <circle cx="58" cy="350" r="4"/>
    <circle cx="422" cy="410" r="5"/>
    <circle cx="393" cy="118" r="3"/>
    <path d="M66 210l5 11 12 5-12 5-5 11-5-11-12-5 12-5z"/>
    <path d="M407 505l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
  </g>
</svg>
