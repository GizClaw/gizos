<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">家庭通讯录</title>
  <desc id="desc">孩子只能呼叫家长在安全管理中批准的固定联系人，页面不提供数字拨号盘。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5ee"/><stop offset="1" stop-color="#eee7ff"/></linearGradient>
    <linearGradient id="mom" x2="1" y2="1"><stop stop-color="#ff9aa8"/><stop offset="1" stop-color="#ef6f8d"/></linearGradient>
    <linearGradient id="dad" x2="1" y2="1"><stop stop-color="#83a8f4"/><stop offset="1" stop-color="#6376d9"/></linearGradient>
    <linearGradient id="grandma" x2="1" y2="1"><stop stop-color="#ffc86d"/><stop offset="1" stop-color="#ec9e55"/></linearGradient>
    <linearGradient id="grandpa" x2="1" y2="1"><stop stop-color="#72cab8"/><stop offset="1" stop-color="#4ca495"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#75678c" flood-opacity=".14"/></filter>
  </defs>
  <rect width="480" height="800" fill="url(#bg)"/>
  <circle cx="-10" cy="180" r="125" fill="#ffccb6" opacity=".18"/><circle cx="480" cy="650" r="145" fill="#c9bfff" opacity=".22"/>
  <circle cx="42" cy="52" r="24" fill="#fff" opacity=".86"/><path d="M47 42l-10 10 10 10" fill="none" stroke="#493f57" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="61" fill="#392f4a" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="750">打电话</text>
  <g font-family="system-ui,'PingFang SC',sans-serif">
    <text x="25" y="117" fill="#71677d" font-size="15" font-weight="650">我的家人</text>

    <g transform="translate(25 139)" filter="url(#shadow)">
      <rect width="430" height="112" rx="28" fill="#fff"/>
      <circle cx="62" cy="56" r="37" fill="url(#mom)"/><circle cx="62" cy="47" r="13" fill="#fff4eb"/><path d="M41 82c5-19 37-19 42 0" fill="#fff4eb"/>
      <text x="119" y="49" fill="#3f354b" font-size="21" font-weight="730">妈妈</text><text x="119" y="77" fill="#948a9b" font-size="14">家庭联系人</text>
      <circle cx="374" cy="56" r="29" fill="#f18468"/><path d="M361 39l9 12-6 7c4 8 9 13 17 17l7-6 12 9c-3 7-8 10-15 8-17-5-31-19-36-36-2-7 1-12 8-15z" fill="#fff"/>
    </g>

    <g transform="translate(25 270)" filter="url(#shadow)">
      <rect width="430" height="112" rx="28" fill="#fff"/>
      <circle cx="62" cy="56" r="37" fill="url(#dad)"/><circle cx="62" cy="47" r="13" fill="#f5f3ff"/><path d="M41 82c5-19 37-19 42 0" fill="#f5f3ff"/>
      <text x="119" y="49" fill="#3f354b" font-size="21" font-weight="730">爸爸</text><text x="119" y="77" fill="#948a9b" font-size="14">家庭联系人</text>
      <circle cx="374" cy="56" r="29" fill="#f18468"/><path d="M361 39l9 12-6 7c4 8 9 13 17 17l7-6 12 9c-3 7-8 10-15 8-17-5-31-19-36-36-2-7 1-12 8-15z" fill="#fff"/>
    </g>

    <g transform="translate(25 401)" filter="url(#shadow)">
      <rect width="430" height="112" rx="28" fill="#fff"/>
      <circle cx="62" cy="56" r="37" fill="url(#grandma)"/><circle cx="62" cy="47" r="13" fill="#fff9e8"/><path d="M41 82c5-19 37-19 42 0" fill="#fff9e8"/>
      <text x="119" y="49" fill="#3f354b" font-size="21" font-weight="730">奶奶</text><text x="119" y="77" fill="#948a9b" font-size="14">家庭联系人</text>
      <circle cx="374" cy="56" r="29" fill="#f18468"/><path d="M361 39l9 12-6 7c4 8 9 13 17 17l7-6 12 9c-3 7-8 10-15 8-17-5-31-19-36-36-2-7 1-12 8-15z" fill="#fff"/>
    </g>

    <g transform="translate(25 532)" filter="url(#shadow)">
      <rect width="430" height="112" rx="28" fill="#fff"/>
      <circle cx="62" cy="56" r="37" fill="url(#grandpa)"/><circle cx="62" cy="47" r="13" fill="#effff9"/><path d="M41 82c5-19 37-19 42 0" fill="#effff9"/>
      <text x="119" y="49" fill="#3f354b" font-size="21" font-weight="730">爷爷</text><text x="119" y="77" fill="#948a9b" font-size="14">家庭联系人</text>
      <circle cx="374" cy="56" r="29" fill="#f18468"/><path d="M361 39l9 12-6 7c4 8 9 13 17 17l7-6 12 9c-3 7-8 10-15 8-17-5-31-19-36-36-2-7 1-12 8-15z" fill="#fff"/>
    </g>

    <rect x="25" y="679" width="430" height="71" rx="25" fill="#fff" opacity=".8"/>
    <path d="M57 700l14 6v10c0 10-6 17-14 21-9-4-15-11-15-21v-10z" fill="#63aa9d"/><path d="M50 717l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="91" y="710" fill="#5e5569" font-size="14">联系人由家长设置</text><text x="91" y="735" fill="#3f354b" font-size="16" font-weight="680">这里只能拨打已允许的家人</text>
  </g>
</svg>
