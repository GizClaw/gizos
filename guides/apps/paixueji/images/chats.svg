<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">近期聊天</title><desc id="desc">聊天页按角色展示近期对话记录，并保留关联照片和作品。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9f5ff"/><stop offset="1" stop-color="#dfe1ff"/></linearGradient></defs><rect width="480" height="800" fill="url(#bg)"/>
  <circle cx="42" cy="52" r="24" fill="#fff" opacity=".76"/><path d="M47 42l-10 10 10 10" fill="none" stroke="#443b59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="61" fill="#322a47" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="750">近期聊天</text>
  <g font-family="system-ui,'PingFang SC',sans-serif">
    <rect x="25" y="95" width="430" height="54" rx="27" fill="#fff" opacity=".78"/><circle cx="55" cy="122" r="9" fill="none" stroke="#81768f" stroke-width="3"/><path d="M62 129l7 7" stroke="#81768f" stroke-width="3" stroke-linecap="round"/><text x="85" y="129" fill="#8a8098" font-size="16">搜索聊天主题</text>
    <text x="25" y="194" fill="#514760" font-size="16" font-weight="650">今天</text>
    <g transform="translate(25 211)"><rect width="430" height="145" rx="29" fill="#fff" opacity=".82"/><circle cx="58" cy="57" r="35" fill="#7561df"/><rect x="38" y="42" width="40" height="31" rx="15" fill="#382c70"/><circle cx="51" cy="57" r="4" fill="#fff"/><circle cx="65" cy="57" r="4" fill="#fff"/><text x="111" y="39" fill="#776d88" font-size="14">小拍 · 10:32</text><text x="111" y="68" fill="#352e47" font-size="19" font-weight="700">公园里的那只小鸟</text><text x="111" y="96" fill="#6c627a" font-size="15">“它为什么会站在树枝上睡觉？”</text><rect x="334" y="105" width="73" height="27" rx="13" fill="#eeeaff"/><text x="370" y="124" text-anchor="middle" fill="#6756c9" font-size="12" font-weight="650">1 张照片</text></g>
    <g transform="translate(25 376)"><rect width="430" height="145" rx="29" fill="#fff" opacity=".82"/><circle cx="58" cy="57" r="35" fill="#62b4a7"/><circle cx="58" cy="57" r="22" fill="#fff"/><path d="M48 62c7 7 14 7 21 0" fill="none" stroke="#4b9d91" stroke-width="3.5" stroke-linecap="round"/><text x="111" y="39" fill="#776d88" font-size="14">芽芽 · 09:06</text><text x="111" y="68" fill="#352e47" font-size="19" font-weight="700">叶子为什么会变黄？</text><text x="111" y="96" fill="#6c627a" font-size="15">关于季节和叶绿素的聊天</text><rect x="320" y="105" width="87" height="27" rx="13" fill="#e7f7f3"/><text x="363" y="124" text-anchor="middle" fill="#3d8a7d" font-size="12" font-weight="650">探索关联</text></g>
    <text x="25" y="565" fill="#514760" font-size="16" font-weight="650">昨天</text>
    <g transform="translate(25 582)"><rect width="430" height="145" rx="29" fill="#fff" opacity=".82"/><circle cx="58" cy="57" r="35" fill="#7561df"/><rect x="38" y="42" width="40" height="31" rx="15" fill="#382c70"/><circle cx="51" cy="57" r="4" fill="#fff"/><circle cx="65" cy="57" r="4" fill="#fff"/><text x="111" y="39" fill="#776d88" font-size="14">小拍 · 昨天</text><text x="111" y="68" fill="#352e47" font-size="19" font-weight="700">一起做一艘月亮船</text><text x="111" y="96" fill="#6c627a" font-size="15">对话生成了 2 张梦境作品</text><rect x="320" y="105" width="87" height="27" rx="13" fill="#f1eaff"/><text x="363" y="124" text-anchor="middle" fill="#7852ba" font-size="12" font-weight="650">继续聊</text></g>
  </g>
</svg>
