  <text x="48" y="149" fill="#a7b0c0" font-family="monospace" font-size="9">DESTROYED</text><text x="192" y="149" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="10">43</text>
  <text x="48" y="166" fill="#a7b0c0" font-family="monospace" font-size="9">MAX COMBO</text><text x="192" y="166" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="10">18</text>
  <text x="48" y="183" fill="#a7b0c0" font-family="monospace" font-size="9">MODULES</text><text x="192" y="183" text-anchor="end" fill="#f9c74f" font-family="monospace" font-size="10">S3 P2 R2 D2</text>
  <rect x="34" y="204" width="172" height="24" rx="12" fill="#5b3fbd"/>
