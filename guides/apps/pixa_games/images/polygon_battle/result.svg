<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Polygon Battle Result</title>
  <desc id="desc">Game over result screen with score and gameplay statistics.</desc>
  <rect width="240" height="240" fill="#050816"/>
  <g fill="#ffffff" opacity=".5"><circle cx="21" cy="28" r="1"/><circle cx="52" cy="66" r="1.5"/><circle cx="184" cy="38" r="1"/><circle cx="218" cy="82" r="1.5"/><circle cx="144" cy="61" r="1"/></g>
  <g transform="translate(120 48)">
    <path d="M0 -20 L16 14 L6 10 L0 18 L-6 10 L-16 14 Z" fill="#42e8e0" stroke="#c8ffff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-6 15 L0 26 L6 15" fill="#f9c74f"/>
  </g>
  <text x="120" y="99" text-anchor="middle" fill="#ff4d6d" font-family="monospace" font-size="18" font-weight="700">GAME OVER</text>
