  <line x1="18" y1="115" x2="302" y2="115" stroke="#173047"/>
  <line x1="18" y1="137" x2="302" y2="137" stroke="#173047"/>
  <line x1="18" y1="159" x2="302" y2="159" stroke="#173047"/>
  <line x1="18" y1="110" x2="18" y2="160" stroke="#25445d"/>
  <line x1="89" y1="110" x2="89" y2="160" stroke="#173047"/>
  <line x1="160" y1="110" x2="160" y2="160" stroke="#173047"/>
  <line x1="231" y1="110" x2="231" y2="160" stroke="#173047"/>
  <line x1="302" y1="110" x2="302" y2="160" stroke="#25445d"/>
  <polyline points="18,151 25,149 32,153 39,146 46,144 53,148 60,141 67,139 74,143 81,134 88,138 95,128 102,131 109,123 116,127 123,119 130,125 137,116 144,121 151,111 158,119 165,114 172,126 179,120 186,132 193,127 200,138 207,130 214,142 221,136 228,146 235,140 242,151 249,144 256,154 263,148 270,156 277,151 284,158 291,153 302,157" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="18,154 25,151 32,155 39,149 46,147 53,151 60,145 67,142 74,146 81,139 88,142 95,134 102,136 109,129 116,132 123,126 130,131 137,123 144,128 151,120 158,126 165,121 172,131 179,126 186,137 193,133 200,142 207,136 214,147 221,141 228,151 235,145 242,156 249,149 256,159 263,153 270,161 277,156 284,162 291,157 302,161" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.8"/>

  <rect x="8" y="178" width="101" height="35" rx="6" fill="#3a2315" stroke="#f97316"/>
  <text x="17" y="191" fill="#fdba74" font-family="ui-monospace, monospace" font-size="8">SIGNAL</text>
  <circle cx="19" cy="203" r="4" fill="#fb923c"/>
