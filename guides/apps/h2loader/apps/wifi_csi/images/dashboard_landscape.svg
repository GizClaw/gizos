  <rect x="116" y="178" width="94" height="35" rx="6" fill="#0f1d30" stroke="#263b55"/>
  <text x="125" y="191" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8">MEAN / VAR</text>
  <text x="125" y="207" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">42.7 / 12.8</text>
  <rect x="217" y="178" width="95" height="35" rx="6" fill="#0f1d30" stroke="#263b55"/>
  <text x="226" y="191" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8">QUEUE / DROP</text>
  <text x="226" y="207" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" font-weight="700">4 / 0</text>

  <rect x="8" y="219" width="304" height="15" rx="4" fill="#111c2b"/>
  <circle cx="16" cy="226.5" r="2.5" fill="#2dd4bf"/>
  <text x="23" y="230" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="8">LAST ERROR</text>
  <text x="82" y="230" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="8" font-weight="700">none · 0</text>
  <text x="302" y="230" text-anchor="end" fill="#64748b" font-family="ui-monospace, monospace" font-size="8">SESSION 3</text>
</svg>
