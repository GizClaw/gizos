<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Wi-Fi CSI Smoke dashboard on SZP</title>
  <desc id="desc">A 320 by 240 landscape diagnostic dashboard showing the ESP-IDF provider, running state, radio metadata, live subcarrier amplitude curve, disturbed signal score, queue status, and last error.</desc>
  <rect width="320" height="240" fill="#07111f"/>

  <rect x="0" y="0" width="320" height="34" fill="#10243d"/>
  <path d="M13 22c4-5 10-5 14 0M16 25c2-2 6-2 8 0M20 28h0" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
  <text x="35" y="22" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="14" font-weight="700">WI-FI CSI</text>
  <text x="125" y="22" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">ESP-IDF</text>
  <rect x="246" y="7" width="64" height="20" rx="10" fill="#123b34" stroke="#2dd4bf"/>
  <text x="278" y="21" text-anchor="middle" fill="#99f6e4" font-family="ui-monospace, monospace" font-size="10" font-weight="700">RUNNING</text>

  <rect x="8" y="42" width="304" height="38" rx="6" fill="#0f1d30" stroke="#263b55"/>
  <text x="17" y="56" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">RSSI</text>
  <text x="17" y="72" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">-48 dBm</text>
  <text x="91" y="56" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">FRAMES/S</text>
  <text x="91" y="72" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">20</text>
  <text x="165" y="56" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">CHANNEL</text>
  <text x="165" y="72" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">6 · 20M</text>
  <text x="245" y="56" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">PHY / MCS</text>
  <text x="245" y="72" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="13" font-weight="700">HT · 0</text>

  <rect x="8" y="88" width="304" height="82" rx="7" fill="#0b1929" stroke="#1e3a53"/>
