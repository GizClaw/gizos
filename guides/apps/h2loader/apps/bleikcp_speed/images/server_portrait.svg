<svg xmlns="http://www.w3.org/2000/svg" width="368" height="448" viewBox="0 0 368 448" role="img" aria-labelledby="title desc">
  <title id="title">BLE iKCP Baseline Server portrait screen</title>
  <desc id="desc">Portrait Server screen for AMOLED with connection, throughput, totals, reconnect counters, and last error.</desc>
  <rect width="368" height="448" fill="#08111f"/>
  <rect x="0" y="0" width="368" height="58" fill="#10243d"/>
  <circle cx="25" cy="29" r="8" fill="#2dd4bf"/>
  <text x="43" y="35" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="19" font-weight="700">BLE iKCP</text>
  <text x="343" y="35" text-anchor="end" fill="#99f6e4" font-family="ui-monospace, monospace" font-size="14" font-weight="700">SERVER · RUNNING</text>

  <rect x="16" y="76" width="336" height="62" rx="12" fill="#0f1d30" stroke="#263b55"/>
  <text x="31" y="98" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">PEER A1:B2</text>
  <text x="31" y="122" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="15" font-weight="700">MTU 517</text>
  <text x="139" y="122" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="15" font-weight="700">PHY 2M</text>
  <text x="239" y="122" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="15" font-weight="700">INT 15ms</text>

