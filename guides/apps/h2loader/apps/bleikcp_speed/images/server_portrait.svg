  <text x="31" y="180" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="13" font-weight="700">TX · LAST 5 SECONDS</text>
  <text x="31" y="218" fill="#ecfeff" font-family="ui-monospace, monospace" font-size="32" font-weight="700">128.4</text>
  <text x="165" y="218" fill="#a5f3fc" font-family="ui-monospace, monospace" font-size="14">KiB/s</text>
  <text x="335" y="215" text-anchor="end" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="12">TOTAL 1.20 GiB</text>

  <rect x="16" y="250" width="336" height="82" rx="12" fill="#12243a" stroke="#3b82f6"/>
  <text x="31" y="276" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="13" font-weight="700">RX · LAST 5 SECONDS</text>
  <text x="31" y="314" fill="#eff6ff" font-family="ui-monospace, monospace" font-size="32" font-weight="700">126.9</text>
  <text x="165" y="314" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="14">KiB/s</text>
  <text x="335" y="311" text-anchor="end" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="12">TOTAL 1.18 GiB</text>

  <rect x="16" y="346" width="336" height="40" rx="8" fill="#0f1d30"/>
  <text x="29" y="371" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">CONN 4</text>
  <text x="105" y="371" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">RECONN 3</text>
  <text x="213" y="371" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">DISC 3</text>
  <text x="286" y="371" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">RTX 0</text>

