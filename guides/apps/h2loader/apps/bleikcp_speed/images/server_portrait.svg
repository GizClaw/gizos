  <text x="29" y="421" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="12">LAST ERROR</text>
  <text x="129" y="421" fill="#fecaca" font-family="ui-monospace, monospace" font-size="12" font-weight="700">stream · -8</text>
