<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GizOS Web App</title>
    <style>
      /* Behaviour only; every visual style comes from the layout. */
      #canvas { image-rendering: pixelated; touch-action: none; }
      [data-h2-button] { touch-action: none; user-select: none; }
    </style>
  </head>
  <body>
    <!-- H2_WEB_APP_LAYOUT -->
    <template id="program">{{{ SCRIPT }}}</template>
    <script>
      // Page components. app_host ships no UI: the layout (usually a board's
      // reusable HTML/CSS) places each component with a slot element, and
      // app_host creates the component inside it:
      //   [data-h2-slot="display"]  the display canvas (#canvas)
      //   [data-h2-slot="controls"] Start/Stop buttons (#start, #stop)
      //   [data-h2-slot="status"]   the status line (#status)
      // A missing slot gets a plain container at the end of <body>.
      function h2Slot(name) {
        let slot = document.querySelector(`[data-h2-slot="${name}"]`);
        if (!slot) {
          slot = document.createElement('div');
          slot.dataset.h2Slot = name;
          document.body.append(slot);
        }
        return slot;
      }
      const h2Canvas = document.createElement('canvas');
      h2Canvas.id = 'canvas';
      h2Slot('display').append(h2Canvas);
      for (const [id, text] of [['start', 'Start'], ['stop', 'Stop']]) {
        const button = document.createElement('button');
        button.id = id;
        button.type = 'button';
        button.textContent = text;
        button.disabled = id === 'stop';
        h2Slot('controls').append(button);
      }
      const h2Status = document.createElement('p');
      h2Status.id = 'status';
      h2Status.textContent = 'Ready';
      h2Slot('status').append(h2Status);
      var Module = {
        canvas: document.getElementById('canvas'),
        print: text => console.log(text),
        printErr: text => console.error(text),
      };
      let h2HostStarted = false;
      // Host-owned opt-in simulation. Never infer fake radios for plain pages.
      globalThis.h2WebApplicationHostConfigureEnvironment = environment => {
        if (h2HostStarted && Module.h2WebEnvironment === undefined)
          throw new Error('Configure the simulated environment before Start');
        const w = environment?.wifi, m = environment?.modem;
        if (environment?.version !== 1 || !w || !m ||
            [w.enabled, w.connected, m.enabled, m.simPresent, m.registered].some(v => typeof v !== 'boolean') ||
            typeof w.ssid !== 'string' || !w.ssid || w.ssid.includes('\0') || new TextEncoder().encode(w.ssid).length > 32 ||
            [w.rssi, m.rssi].some(v => !Number.isInteger(v) || v < -127 || v > 0)) {
          throw new TypeError('Invalid simulated radio environment');
        }
        Module.h2WebEnvironment = structuredClone(environment);
        globalThis.dispatchEvent(new Event('h2-web-environment-change'));
      };
      const start = document.getElementById('start');
      const stop = document.getElementById('stop');
      // Start is the user gesture that unlocks audio and the microphone.
      start.addEventListener('click', () => {
        h2HostStarted = true;
        start.disabled = true;
        stop.disabled = false;
        const AudioContext = globalThis.AudioContext || globalThis.webkitAudioContext;
        if (AudioContext) {
          Module.h2WebAudioContext = new AudioContext();
          Module.h2WebAudioContext.resume().catch(() => {});
        }
        const source = document.querySelector('#program').content.querySelector('script');
        const loader = document.createElement('script');
        for (const attribute of source.attributes)
          loader.setAttribute(attribute.name, attribute.value);
        loader.addEventListener('error', () => {
          document.getElementById('status').textContent = 'WebAssembly load failed';
        });
        document.body.appendChild(loader);
      }, {once: true});
      stop.addEventListener('click', () => {
        stop.disabled = true;
        Module._h2_web_application_host_request_stop?.();
      });

      // Button input. app_host passes each Button's index, keyboard key and
      // name; the key and every [data-h2-button="<name>"] element hold it.
      // Sources describe physical intent. An ordered outbox retains every
      // aggregate edge until Runtime accepts it; transient backpressure must
      // not discard a release or let the next press overtake it.
      const h2Buttons = [];
      const h2InputPending = [];
      const h2InputWaiters = [];
      const h2InputCapacity = 256;
      let h2InputTimer = null, h2InputDraining = false, h2InputClosing = false;
      let h2InputFault = 0;
      function h2InputSettled() {
        if (h2InputDraining || h2InputPending.length) return;
        if (h2InputTimer !== null) clearTimeout(h2InputTimer);
        h2InputTimer = null;
        for (const resolve of h2InputWaiters.splice(0)) resolve();
      }
      function h2InputFail(rc) {
        if (h2InputFault) return;
        h2InputFault = rc;
        if (h2InputTimer !== null) clearTimeout(h2InputTimer);
        h2InputTimer = null;
        h2InputPending.length = 0;
        globalThis.removeEventListener('keydown', h2KeyDown);
        globalThis.removeEventListener('keyup', h2KeyUp);
        for (const entry of h2Buttons) {
          entry.active = false;
          entry.abort.abort();
          entry.sources.clear();
          for (const element of entry.elements) element.dataset.pressed = 'false';
        }
        console.error(`H2_WEB_APP input=FAIL rc=${rc}`);
        Module._h2_web_application_host_input_failed(rc);
      }
      function h2RetryInput() {
        if (h2InputTimer === null)
          h2InputTimer = setTimeout(() => { h2InputTimer = null; h2DrainInput(); }, 4);
      }
      function h2DrainInput() {
        if (h2InputDraining) return;
        h2InputDraining = true;
        try {
          for (let work = 0; !h2InputFault && h2InputPending.length && work < 32; work++) {
            const {entry, pressed} = h2InputPending[0];
            const rc = Module._h2_web_application_host_button(entry.index, pressed ? 1 : 0);
            if (rc === 0) h2InputPending.shift();
            else if (entry.retryable.has(rc)) { h2RetryInput(); break; }
            else h2InputFail(Number.isInteger(rc) && rc < 0 ? rc : entry.ioError);
          }
          if (!h2InputFault && h2InputPending.length) h2RetryInput();
        } catch (_) {
          h2InputFail(h2InputPending[0]?.entry.ioError || h2Buttons[0].ioError);
        } finally {
          h2InputDraining = false;
          h2InputSettled();
        }
      }
      function h2QueueEdge(entry, pressed) {
        if (h2InputFault) return;
        if (h2InputPending.length === h2InputCapacity) h2InputFail(entry.fullError);
        else { h2InputPending.push({entry, pressed}); h2DrainInput(); }
      }
      function h2SetSource(entry, source, pressed) {
        if (!entry.active || h2InputClosing || h2InputFault) return;
        const was = entry.sources.size > 0;
        if (pressed) entry.sources.add(source);
        else entry.sources.delete(source);
        const is = entry.sources.size > 0;
        for (const element of entry.elements) element.dataset.pressed = String(is);
        if (was !== is) h2QueueEdge(entry, is);
      }
      function h2ReleaseAll() {
        for (const entry of h2Buttons) {
          const pressed = entry.sources.size > 0;
          entry.sources.clear();
          for (const element of entry.elements) element.dataset.pressed = 'false';
          if (pressed) h2QueueEdge(entry, false);
        }
      }
      function h2OnKey(event, down) {
        if (event.repeat) return;
        for (const entry of h2Buttons) {
          if (!entry.key || event.key !== entry.key) continue;
          event.preventDefault();
          h2SetSource(entry, 'key', down);
        }
      }
      const h2KeyDown = (event) => h2OnKey(event, true);
      const h2KeyUp = (event) => h2OnKey(event, false);
      globalThis.h2WebApplicationHostBindButton =
          (index, key, name, ioError, timeoutError, busyError, wouldBlockError, fullError) => {
        if (typeof Module._h2_web_application_host_button !== 'function' ||
            typeof Module._h2_web_application_host_input_failed !== 'function')
          throw new Error('Missing Web Host input exports');
        if (h2Buttons.length === 0) {
          if (h2InputDraining || h2InputPending.length || h2InputWaiters.length)
            throw new Error('Previous Web Host input has not drained');
          h2InputClosing = false;
          h2InputFault = 0;
        }
        const selector = name ? `[data-h2-button="${CSS.escape(name)}"]` : null;
        const entry = {index, key, name, ioError, fullError, active: true,
                       retryable: new Set([timeoutError, busyError, wouldBlockError, fullError]),
                       sources: new Set(), abort: new AbortController(),
                       elements: selector ? [...document.querySelectorAll(selector)] : []};
        const signal = entry.abort.signal;
        for (const element of entry.elements) {
          element.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            try { element.setPointerCapture?.(event.pointerId); } catch (_) {}
            h2SetSource(entry, `pointer:${event.pointerId}`, true);
          }, {signal});
          for (const type of ['pointerup', 'pointercancel', 'lostpointercapture'])
            element.addEventListener(type, (event) =>
              h2SetSource(entry, `pointer:${event.pointerId}`, false), {signal});
        }
        if (h2Buttons.length === 0) {
          globalThis.addEventListener('keydown', h2KeyDown);
          globalThis.addEventListener('keyup', h2KeyUp);
        }
        h2Buttons.push(entry);
      };
      globalThis.h2WebApplicationHostUnbindButtons = () => {
        h2InputClosing = true;
        for (const entry of h2Buttons) entry.abort.abort();
        globalThis.removeEventListener('keydown', h2KeyDown);
        globalThis.removeEventListener('keyup', h2KeyUp);
        h2ReleaseAll();
        for (const entry of h2Buttons) entry.active = false;
        // The C control task awaits this Promise before destroying Runtime.
        // The browser stays responsive while a full queue or busy lock clears.
        return new Promise(resolve => {
          h2InputWaiters.push(() => { h2Buttons.length = 0; resolve(); });
          h2DrainInput();
        });
      };
      globalThis.addEventListener('blur', h2ReleaseAll);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) h2ReleaseAll();
      });
    </script>
  </body>
</html>
