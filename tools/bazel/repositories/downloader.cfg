# Prefer Bazel's official mirror for immutable GitHub release archives.
# Keep the original URL as a fallback; the declared integrity still applies.
rewrite github.com/([^/]+)/([^/]+)/releases/download/(.*) mirror.bazel.build/github.com/$1/$2/releases/download/$3
rewrite github.com/([^/]+)/([^/]+)/releases/download/(.*) github.com/$1/$2/releases/download/$3
