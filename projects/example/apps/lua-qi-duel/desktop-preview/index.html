<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>气决 · Desktop Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; background: #020407;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #6deaff;
    }
    .shell { display: grid; grid-template-columns: auto 230px; gap: 22px; align-items: start; padding: 24px; }
    .stage { display: grid; gap: 10px; justify-items: center; }
    canvas {
      width: min(62vw, 460px); aspect-ratio: 368 / 448;
      image-rendering: auto; border-radius: 30px;
      box-shadow: 0 0 0 1px #0c3340, 0 0 50px #006b8a55;
      background: #000;
    }
    .hint { font-size: 11px; letter-spacing: .12em; opacity: .72; }
    .inspector {
      width: 230px; max-height: min(82vh, 560px); overflow: auto;
      padding: 14px; border: 1px solid #0b4053; border-radius: 14px;
      background: rgba(1, 12, 18, .94); box-shadow: 0 0 28px #006b8a20;
    }
    .inspector h1 { margin: 0 0 5px; font-size: 14px; letter-spacing: .12em; }
    .inspector p { margin: 0 0 12px; color: #578493; font-size: 10px; line-height: 1.5; }
    .layers { display: grid; gap: 6px; }
    .layer-button {
      width: 100%; padding: 8px 10px; border: 1px solid #103b4a; border-radius: 7px;
      background: #030b10; color: #6e9eaa; text-align: left; font: inherit; font-size: 11px;
      cursor: pointer; transition: .15s ease;
    }
    .layer-button:hover { color: #b4f6ff; border-color: #1d7896; }
    .layer-button.active { color: #e3fcff; border-color: #2ee4ff; background: #073140; box-shadow: inset 3px 0 #2ee4ff; }
    .layer-button span { display: inline-block; width: 24px; color: #2ee4ff; }
    body[data-mode="desktop"] {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, rgba(0, 112, 148, .13), transparent 45%),
        #010305;
    }
    body[data-mode="desktop"] .shell {
      width: 100vw; height: 100vh; grid-template-columns: 1fr;
      place-items: center; padding: 18px;
    }
    body[data-mode="desktop"] .stage { gap: 8px; }
    body[data-mode="desktop"] canvas {
      width: min(calc(100vw - 36px), calc((100vh - 54px) * 368 / 448), 552px);
      border-radius: 0;
      box-shadow: 0 0 0 1px rgba(46, 228, 255, .3), 0 0 54px rgba(0, 151, 196, .18);
      touch-action: none;
    }
    body[data-mode="desktop"] .inspector { display: none; }
    body[data-mode="desktop"] .hint {
      color: #78aab4; font-size: 10px; letter-spacing: .08em;
    }
    @media (max-width: 760px) {
      body { place-items: start center; }
      .shell { grid-template-columns: 1fr; padding: 14px; }
      canvas { width: min(92vw, 460px); }
      .inspector { width: min(92vw, 460px); max-height: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage">
      <canvas id="game" width="368" height="448"></canvas>
      <div class="hint" id="current-layer">368 × 448 · 30 FPS</div>
    </section>
    <aside class="inspector">
      <h1>动效分层检查台</h1>
      <p>每次只显示一层，并保留它在最终画面中的真实坐标、尺寸与速度。</p>
      <div class="layers" id="layers"></div>
    </aside>
  </main>
  <script>
    const canvas = document.querySelector('#game');
    const displayCtx = canvas.getContext('2d', { alpha: false });
    const frameCanvas = document.createElement('canvas');
    frameCanvas.width = 368; frameCanvas.height = 448;
    const ctx = frameCanvas.getContext('2d', { alpha: false });
    const W = 368, H = 448, TAU = Math.PI * 2;
    const GOLDEN_FRAME_MS = 1875;
    const query = new URLSearchParams(location.search);
    const desktopMode = query.get('mode') === 'desktop';
    const emulateRgb565 = desktopMode && query.get('rgb565') !== '0';
    document.body.dataset.mode = desktopMode ? 'desktop' : 'inspector';
    const freezeGoldenFrame = query.get('frame') === 'golden';
    const layerDefinitions = [
      ['full', '完整合成'],
      ['walls', '侧墙随机纵向短灯'],
      ['wheel', '竞技场电子灯线'],
      ['dust', '轮盘环绕微粒'],
      ['particles', '空间双路径粒子'],
      ['opponent', '对手完整立绘'],
      ['hand-left', '我方左手'],
      ['hand-right', '我方右手'],
      ['hud', '顶部状态栏'],
      ['carousel', '技能转盘完整合成'],
      ['carousel-frame', '技能转盘底盘'],
      ['charge-cells', '弧形聚气格'],
      ['skill-charge', '聚气技能图标'],
      ['skill-wave', '发波技能图标'],
      ['skill-absorb', '吸收技能图标'],
      ['skill-guard', '防御技能图标'],
    ];
    let activeLayer = desktopMode ? 'full' : (query.get('layer') || 'full');
    if (!layerDefinitions.some(([id]) => id === activeLayer)) activeLayer = 'full';
    const paths = {
      mock: '../assets/source/approved-mockup.png',
      opponent: '../assets/source/opponent-full.png',
      left: '../assets/source/player-hand-left.png',
      right: '../assets/source/player-hand-right.png',
      skills: '../assets/source/skill-icons-v1.png',
      chargeMeter: '../assets/source/charge-meter-v1.png',
      carouselBase: '../assets/source/carousel-base-v1.png',
    };
    const load = src => new Promise((resolve, reject) => {
      const image = new Image(); image.onload = () => resolve(image);
      image.onerror = reject; image.src = src;
    });

    // Seeded randomness makes every animation frame reproducible. The approved
    // visual can therefore be captured from the renderer at one exact timestamp.
    let seed = 0x51D0E1;
    const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

    // Two independent particle fields: energy streaks burst toward the viewer,
    // while ring dust stays attached to the arena plane.
    const particles = Array.from({ length: 104 }, (_, i) => ({
      a: (i * 2.399 + rand() * .32) % TAU,
      p0: rand(), speed: .11 + rand() * .23,
      size: .42 + rand() * 1.18,
      hue: i % 5 === 0 ? 292 : (i % 7 === 0 ? 28 : 193),
      wobble: rand() * TAU,
    }));
    const ringDust = Array.from({ length: 34 }, (_, i) => ({
      a: rand() * TAU,
      r: .24 + rand() * .76,
      speed: .11 + rand() * .2,
      size: .45 + rand() * 1.15,
      hue: i % 4 === 0 ? 286 : 190,
    }));
    const floorRectLights = Array.from({ length: 12 }, (_, i) => ({
      angle: rand() * TAU,
      radius: .65 + rand() * 1.9,
      length: .16 + rand() * .42,
      width: .035 + rand() * .065,
      phase: rand() * TAU,
      rate: .42 + rand() * 1.25,
      tangent: rand() > .72,
      hue: i % 4 === 0 ? 278 : 190,
    }));
    // Sparse wall dashes replace large structural glyphs. Positions are fixed
    // and reproducible; independent envelopes make individual lamps appear
    // and disappear without creating a travelling scan.
    const wallLights = [-1, 1].flatMap(side =>
      Array.from({ length: 36 }, (_, index) => {
        const key = index * 109 + side * 31;
        const lane = Math.floor(index / 12);
        const depth = Math.min(.995,
          ((index % 12) + hash01(key + 7) * .88) / 12);
        return {
          side, depth,
          lift: hash01(key + 13),
          length: .58 + hash01(key + 43) * .86,
          hue: hash01(key + 59) > .84 ? 28 :
            (hash01(key + 61) > .62 ? 282 : 191),
          phase: hash01((index % 12) * 71 + side * 17) * TAU + lane * TAU / 3,
          rate: .34 + hash01(key + 83) * .72,
        };
      })
    );
    let selected = 0, dragStart = null, dragX = 0, targetDrag = 0;
    const hudLayout = {
      width: 190,
      height: 190 * 116 / 398,
      sidePadding: 10,
      playerY: 57,
      enemyY: 15,
    };
const meterParam = (name, max, fallback) => {
  const raw = query.get(name);
  if (raw == null || raw === '') return fallback;
  const value = Number(raw);
  return Number.isFinite(value) ? Math.max(0, Math.min(max, Math.round(value))) : fallback;
};
    const previewMeters = {
      charge: meterParam('charge', 10, 3),
      player: meterParam('playerHp', 5, 4),
      enemy: meterParam('enemyHp', 5, 4),
    };
    const meterFx = { charge: null, player: null, enemy: null };

    function changePreviewMeter(target, delta) {
      const oldValue = previewMeters[target];
      const maxValue = target === 'charge' ? 10 : 5;
      const nextValue = Math.max(0, Math.min(maxValue, oldValue + delta));
      if (nextValue === oldValue) return;
      previewMeters[target] = nextValue;
      const direction = nextValue > oldValue ? 1 : -1;
      const index = target === 'charge'
        ? (direction > 0 ? nextValue - 1 : oldValue - 1)
        : target === 'player'
          ? (direction > 0 ? nextValue - 1 : oldValue - 1)
          : (direction > 0 ? 5 - nextValue : 5 - oldValue);
      meterFx[target] = { index, direction, start: performance.now() };
      const name = target === 'charge' ? '聚气' : (target === 'player' ? '我方血量' : '敌方血量');
      currentLayerLabel.textContent = `${name} ${nextValue}/${maxValue} · 左半减少 / 右半增加 · 30 FPS`;
    }

    // Perspective projection for the horizontal arena plane. Circles are
    // sampled in world space and projected point by point; they are never
    // approximated with Canvas ellipse().
    const ARENA_VERTICAL_OFFSET = 16;
    const arenaCamera = {
      cx: 184, horizon: 171 + ARENA_VERTICAL_OFFSET,
      fx: 420, fy: 624, depth: 8,
    };
    const ARENA_LIGHT_GAIN = .8;
    function arenaProject(worldX, worldZ) {
      return [
        arenaCamera.cx + arenaCamera.fx * worldX / worldZ,
        arenaCamera.horizon + arenaCamera.fy / worldZ,
      ];
    }
    function arenaPolar(radius, angle) {
      return arenaProject(radius * Math.cos(angle), arenaCamera.depth + radius * Math.sin(angle));
    }
    function traceArenaArc(radius, start, end, steps = 32, move = true, yOffset = 0) {
      for (let i = 0; i <= steps; i++) {
        const angle = start + (end - start) * i / steps;
        const [x, y] = arenaPolar(radius, angle);
        if (i === 0 && move) ctx.moveTo(x, y + yOffset);
        else ctx.lineTo(x, y + yOffset);
      }
    }
    function hash01(value) {
      const x = Math.sin(value * 91.733 + 17.133) * 43758.5453;
      return x - Math.floor(x);
    }
    const smoothstep01 = value => value * value * (3 - 2 * value);
    function drawParticleBar(x1, y1, x2, y2, width, hue, alpha) {
      const points = [];
      for (let i = 0; i <= 8; i++) {
        const u = i / 8;
        points.push([x1 + (x2 - x1) * u, y1 + (y2 - y1) * u]);
      }
      drawParticlePath(points, width, hue, alpha);
    }
    function drawParticlePath(points, width, hue, alpha) {
      if (points.length < 2) return;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let i = 1; i < points.length; i++) {
        const u = i / (points.length - 1);
        const taper = .12 + .88 * Math.pow(u, 1.35);
        const segmentAlpha = alpha * Math.pow(u, 1.7);
        ctx.strokeStyle = `hsla(${hue},100%,58%,${segmentAlpha * .18})`;
        ctx.lineWidth = width * taper * 4.4;
        ctx.beginPath(); ctx.moveTo(...points[i - 1]); ctx.lineTo(...points[i]); ctx.stroke();
        ctx.strokeStyle = `hsla(${hue},100%,76%,${segmentAlpha})`;
        ctx.lineWidth = Math.max(.18, width * taper);
        ctx.beginPath(); ctx.moveTo(...points[i - 1]); ctx.lineTo(...points[i]); ctx.stroke();
      }
    }

    function drawWallNeonSegment(x1, y1, x2, y2, width, hue, brightness) {
      const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
      gradient.addColorStop(0, `hsla(${hue},100%,58%,.12)`);
      gradient.addColorStop(.18, `hsla(${hue},100%,62%,.9)`);
      gradient.addColorStop(.72, `hsla(${hue},100%,68%,1)`);
      gradient.addColorStop(1, `hsla(${hue},100%,58%,.16)`);
      ctx.lineCap = 'square';

      ctx.strokeStyle = `hsla(${hue},100%,55%,${brightness * .13})`;
      ctx.lineWidth = width * 7.5;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

      ctx.save();
      ctx.shadowColor = `hsla(${hue},100%,60%,${brightness * .95})`;
      ctx.shadowBlur = 5 + width * 3.2;
      ctx.globalAlpha = brightness;
      ctx.strokeStyle = gradient;
      ctx.lineWidth = width * 2.25;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = `hsla(${hue},100%,88%,${brightness * .92})`;
      ctx.lineWidth = Math.max(.38, width * .48);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }

    function drawWallLight(light, t) {
      const { side, depth, lift, length, hue, phase, rate } = light;
      const perspective = .25 + depth * .75;
      const x = 184 + side * (6 + depth * 181);
      // The visible wall opens vertically toward the viewer: near the side
      // edges it fills most of the arena wall height, then collapses into the
      // central vanishing band as depth approaches zero.
      const wallTop = 164 - depth * 124;
      const wallBottom = 170 + depth * 44;
      const y = wallTop + (wallBottom - wallTop) * lift;
      const pulse = Math.max(0, Math.sin(t * rate + phase));
      const brightness = Math.pow(pulse, 2.55) * (.58 + depth * .41);
      if (brightness < .018) return;

      const size = (3.1 + perspective * 7.1) * length;
      const width = .38 + perspective * .78;
      drawWallNeonSegment(x, y - size * .5, x, y + size * .5,
        width, hue, brightness);
    }

    function drawArenaStructure(time, pass = 'all') {
      const t = time * .001, cx = 184, horizon = 167, cy = 184;
      const show = name => pass === 'all' || pass === name;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Sparse short neon dashes imply the side walls without drawing the
      // arena disc, floor rails, connector plates, or moving scan lines.
      if (show('walls')) {
        wallLights.forEach(light => drawWallLight(light, t));
      }

      // Every electronic light segment stays in place and fades independently.
      if (show('wheel')) {
      ctx.fillStyle = 'rgba(0,12,25,.64)';
      ctx.beginPath(); traceArenaArc(2.7, 0, TAU, 96); ctx.closePath(); ctx.fill();

      // Front lip gives the horizontal disc visible thickness; the back edge
      // remains thin because it is farther from the camera.
      ctx.fillStyle = 'rgba(0,14,25,.82)';
      ctx.beginPath(); traceArenaArc(2.7, Math.PI, TAU, 48);
      traceArenaArc(2.7, TAU, Math.PI, 48, false, 3); ctx.closePath(); ctx.fill();

      const wheelRings = [.36, .68, 1.05, 1.45, 1.87, 2.28, 2.7];
      wheelRings.forEach((radius, ring) => {
        const slots = 16 + ring * 2;
        const slotAngle = TAU / slots;
        for (let s = 0; s < slots; s++) {
          if (hash01(ring * 401 + s * 97) < .45) continue;
          const jitter = hash01(ring * 181 + s * 43) * .52;
          const start = (s + jitter) * slotAngle;
          const depth = (1 - Math.sin(start + slotAngle * .5)) * .5;
          const baseSpan = .44 + hash01(ring * 307 + s * 67) * 1.05;
          const span = baseSpan * (.5 + depth * 1.18);
          const end = start + slotAngle * span;
          const faulty = hash01(ring * 263 + s * 41) > .88;
          const phase = hash01(ring * 117 + s * 19) * TAU;
          const rate = .65 + hash01(ring * 71 + s * 13) * 2.2;
          const wave = .5 + .5 * Math.sin(t * rate + phase);
          const secondary = .72 + .28 * Math.sin(t * (rate * .37 + .31) + phase * 1.7);
          let brightness = (.08 + .92 * wave * wave) * secondary;
          if (faulty) {
            const contact = .5 + .5 * Math.sin(t * (8 + hash01(s + ring * 9) * 10) + phase);
            brightness *= .07 + .93 * Math.pow(contact, 7);
          }
          const near = .16 + .84 * depth;
          const hue = (ring * 3 + s) % 7 < 2 ? 276 : 190;
          const width = .42 + depth * 2.25;

          ctx.strokeStyle = `hsla(${hue},100%,60%,${brightness * near * .2 * ARENA_LIGHT_GAIN})`;
          ctx.lineWidth = width * (3.2 + depth * 1.4);
          ctx.beginPath(); traceArenaArc(radius, start, end, 5); ctx.stroke();
          ctx.strokeStyle = `hsla(${hue},100%,72%,${brightness * near * .94 * ARENA_LIGHT_GAIN})`;
          ctx.lineWidth = width;
          ctx.beginPath(); traceArenaArc(radius, start, end, 5); ctx.stroke();
        }
      });

      // Fixed radial light-line fragments complete the circuit-board pattern.
      for (let i = 0; i < 32; i++) {
        if (hash01(i * 173) < .42) continue;
        const a = i / 32 * TAU;
        const inner = .3 + hash01(i * 29) * 1.72;
        const depth = (1 - Math.sin(a)) * .5;
        const baseLength = .15 + hash01(i * 47) * .42;
        const length = baseLength * (.52 + depth * 1.2);
        const [x1, y1] = arenaPolar(inner, a), [x2, y2] = arenaPolar(Math.min(2.62, inner + length), a);
        const faulty = hash01(i * 83) > .9;
        const phase = hash01(i * 61) * TAU;
        const rate = .8 + hash01(i * 37) * 2.6;
        const wave = .5 + .5 * Math.sin(t * rate + phase);
        let brightness = .06 + .94 * wave * wave;
        if (faulty) {
          const contact = .5 + .5 * Math.sin(t * (9 + hash01(i) * 11) + phase * 1.3);
          brightness *= .06 + .94 * Math.pow(contact, 8);
        }
        const near = .16 + .84 * depth;
        const hue = i % 6 < 2 ? 276 : 190;
        const width = .4 + depth * 2.15;
        ctx.strokeStyle = `hsla(${hue},100%,58%,${brightness * near * .2 * ARENA_LIGHT_GAIN})`;
        ctx.lineWidth = width * (3.1 + depth * 1.35);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.strokeStyle = `hsla(${hue},100%,73%,${brightness * near * .92 * ARENA_LIGHT_GAIN})`;
        ctx.lineWidth = width;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }

      // A few floor-mounted rectangular lamps fade in briefly. Their four
      // world-space corners are projected independently, creating natural
      // near-field stretching and far-field compression.
      floorRectLights.forEach((lamp, i) => {
        const pulse = .5 + .5 * Math.sin(t * lamp.rate + lamp.phase);
        const brightness = Math.pow(pulse, 5);
        if (brightness < .018) return;

        const cxw = Math.cos(lamp.angle) * lamp.radius;
        const czw = arenaCamera.depth + Math.sin(lamp.angle) * lamp.radius;
        const orientation = lamp.angle + (lamp.tangent ? Math.PI * .5 : 0);
        const ux = Math.cos(orientation) * lamp.length * .5;
        const uz = Math.sin(orientation) * lamp.length * .5;
        const vx = -Math.sin(orientation) * lamp.width * .5;
        const vz = Math.cos(orientation) * lamp.width * .5;
        const corners = [
          arenaProject(cxw - ux - vx, czw - uz - vz),
          arenaProject(cxw + ux - vx, czw + uz - vz),
          arenaProject(cxw + ux + vx, czw + uz + vz),
          arenaProject(cxw - ux + vx, czw - uz + vz),
        ];
        const depth = (1 - Math.sin(lamp.angle)) * .5;
        ctx.save();
        ctx.shadowColor = `hsla(${lamp.hue},100%,62%,${brightness * .9 * ARENA_LIGHT_GAIN})`;
        ctx.shadowBlur = 2 + depth * 5;
        ctx.fillStyle = `hsla(${lamp.hue},100%,72%,${brightness * (.42 + depth * .55) * ARENA_LIGHT_GAIN})`;
        ctx.beginPath(); ctx.moveTo(...corners[0]);
        for (let c = 1; c < corners.length; c++) ctx.lineTo(...corners[c]);
        ctx.closePath(); ctx.fill(); ctx.restore();
      });
      }
      ctx.restore();
    }

    function drawArena(images, time, pass = 'all') {
      drawArenaStructure(time, pass);
      const t = time * .001;
      const [originX, originY] = arenaProject(0, arenaCamera.depth);
      const show = name => pass === 'all' || pass === name;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      // Small sparks orbit on the wheel surface so the dial itself feels alive.
      if (show('dust')) {
      ringDust.forEach((p, i) => {
        const a = p.a + t * p.speed * (i % 2 ? 1 : -1);
        const radius = 28 + p.r * 142;
        const x = originX + Math.cos(a) * radius;
        const y = originY + Math.sin(a) * radius * .235;
        const twinkle = .35 + .65 * Math.abs(Math.sin(t * 2.4 + i));
        ctx.fillStyle = `hsla(${p.hue},100%,66%,${twinkle * .7})`;
        ctx.beginPath(); ctx.arc(x, y, p.size, 0, TAU); ctx.fill();
      });
      }

      const drawFloorParticles = pass === 'all' || pass === 'particles';
      const drawWallParticles = pass === 'all' || pass === 'particles';

      // Front-half particles travel on the ground plane toward the camera.
      // Perspective projection enlarges both bar length and width naturally.
      if (drawFloorParticles) {
      particles.slice(0, 52).forEach((p, i) => {
        const progress = (p.p0 + t * p.speed * .72) % 1;
        let sizeFraction, opacity;
        if (progress < .58) {
          const grow = smoothstep01(progress / .58);
          sizeFraction = .24 + grow * .76; opacity = .28 + grow * .72;
        } else {
          const inverse = 1 - (progress - .58) / .42;
          sizeFraction = Math.pow(inverse, 1.45); opacity = Math.pow(inverse, 1.7);
        }

        const route = smoothstep01(progress);
        const lateral = (hash01(i * 31 + 4) * 2 - 1) * .76;
        const forward = Math.sqrt(1 - lateral * lateral);
        const distance = route * (5.05 + hash01(i * 47 + 9) * .72);
        const worldZ = arenaCamera.depth - forward * distance;
        if (worldZ <= 1.15) return;
        const perspective = arenaCamera.depth / worldZ;
        const trailWorldLength = (.21 + p.size * .11) *
          (.5 + Math.pow(perspective, .82) * .82);
        const tailDistance = Math.max(0, distance - trailWorldLength);
        const [headX, headY] = arenaProject(lateral * distance, worldZ);
        const [tailX, tailY] = arenaProject(
          lateral * tailDistance, arenaCamera.depth - forward * tailDistance);
        const width = Math.min(14,
          (.44 + p.size * .36) * Math.pow(perspective, 1.58) * sizeFraction);
        const alpha = Math.min(1, opacity * (.35 + perspective * .28));
        drawParticleBar(tailX, tailY, headX, headY, width, p.hue, alpha);
      });
      }

      // Rear-half particles first cross the floor to the curved wall connector,

      if (dragStart == null) return; targetDrag = Math.max(-90, Math.min(90, (e.clientX-dragStart) * 368/canvas.clientWidth));
    });
    canvas.addEventListener('pointerup', e => {
      if (dragStart == null) return;
      if (targetDrag < -28) selected = (selected + 1) % 4;
      if (targetDrag > 28) selected = (selected + 3) % 4;
      dragStart = null; targetDrag = 0;
    });
  </script>
</body>
</html>
