<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GizOS Web App</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080b12; color: #e5e7eb; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { display: grid; gap: 12px; justify-items: center; }
      canvas { max-width: calc(100vw - 32px); background: #000; image-rendering: pixelated; touch-action: none; }
      .controls { display: flex; gap: 8px; }
      button { padding: 10px 24px; border: 0; border-radius: 8px; background: #38bdf8; color: #082f49; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: default; opacity: 0.65; }
      #status { margin: 0; color: #94a3b8; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <canvas id="canvas" width="240" height="240"></canvas>
      <div class="controls">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
      </div>
      <p id="status">Ready</p>
    </main>
    <template id="program">{{{ SCRIPT }}}</template>
    <script>
      var Module = {
        canvas: document.getElementById('canvas'),
        print: text => console.log(text),
        printErr: text => console.error(text),
      };
      const start = document.getElementById('start');
      const stop = document.getElementById('stop');
      // Start is the user gesture that unlocks audio and the microphone.
      start.addEventListener('click', () => {
        start.disabled = true;
        stop.disabled = false;
        const AudioContext = globalThis.AudioContext || globalThis.webkitAudioContext;
        if (AudioContext) {
          Module.h2WebAudioContext = new AudioContext();
          Module.h2WebAudioContext.resume().catch(() => {});
        }
        const source = document.querySelector('#program').content.querySelector('script');
        const loader = document.createElement('script');
        for (const attribute of source.attributes)
          loader.setAttribute(attribute.name, attribute.value);
        loader.addEventListener('error', () => {
          document.getElementById('status').textContent = 'WebAssembly load failed';
        });
        document.body.appendChild(loader);
      }, {once: true});
      stop.addEventListener('click', () => {
        stop.disabled = true;
        Module._h2_web_app_host_request_stop?.();
      });
    </script>
  </body>
</html>
