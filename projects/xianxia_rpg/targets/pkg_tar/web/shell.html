<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>竹溪仙缘 · 十章合辑 / 长明归途</title>
<style>
  html, body { margin: 0; height: 100%; background: #16121a; color: #e8dcc6;
    font: 14px/1.5 ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif; }
  body { display: grid; place-items: center; overscroll-behavior: none; }
  main { display: grid; gap: 12px; justify-items: center; padding: 16px; }
  canvas { width: min(94vw, calc((100vh - 96px) * 4 / 3), 960px); aspect-ratio: 4 / 3;
    border-radius: 14px; box-shadow: 0 18px 50px #000a; touch-action: none;
    cursor: pointer; image-rendering: auto; background: #241e2a; }
  p { margin: 0; opacity: .72; text-align: center; }
</style>
<main>
  <canvas id="canvas" width="640" height="480"></canvas>
  <p id="status">加载中…</p>
</main>
<script>
  const status = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: text => console.log(text),
    printErr: text => console.error(text),
    onRuntimeInitialized: () => {
      status.textContent = '轻触地面行走、标名人物或物件互动；“新的旅程”从第一章开始，“章节”可直进最终章。回到竹溪，点四位援手分派去处，再去古祠。战斗看上方招式与亮边指令，点右上队友框换人，第三拍按提示结阵。每段胜利单独记录，战败或刷新从当前段重试；结局轻触回标题。';
    },
    onAbort: reason => { status.textContent = '已停止：' + reason; },
  };
</script>
{{{ SCRIPT }}}
</html>
