<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Garden Guard</title>
<style>
  @font-face { font-family: "Garden Droid"; src: url("droid-sans-fallback.woff") format("woff");
    font-weight: 400; font-style: normal; font-display: swap; }
  html[lang="zh-CN"] #game-status { font-family: "Garden Droid", sans-serif; }
  html, body { margin: 0; height: 100%; background: #16200f; color: #e3ecd2;
    font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; place-items: center; overscroll-behavior: none; }
  main { box-sizing: border-box; width: 100%; display: grid; gap: 12px;
    justify-items: center; padding: 12px min(3vw, 16px); }
  canvas { display: block; width: min(100%, calc((100svh - 24px) * 1.5), 1120px); aspect-ratio: 3 / 2; border-radius: 10px;
    box-shadow: 0 18px 50px #000a; touch-action: none; cursor: pointer;
    image-rendering: auto; background: #2c4a1c; }
  p { margin: 0; opacity: .8; }
  #game-status[data-ready="true"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
<main>
  <canvas id="canvas" width="480" height="320"></canvas>
  <p id="game-status" role="status">Loading…</p>
</main>
<script>
  const gameStatus = document.getElementById('game-status');
  const messages = {
    en: {
      title: 'Garden Guard', loading: 'Loading the garden…',
      wait: 'Close the other Garden Guard tab on this address to continue.',
      ready: 'Collect sun, choose a card, then plant on the lawn.',
      error: 'The garden could not start. Reload to try again.',
    },
    'zh-CN': {
      title: '植物守卫', loading: '正在加载庭院…',
      wait: '请关闭此地址的另一个植物守卫标签页，再继续。',
      ready: '收集阳光，选择植物卡，再点草坪种植。',
      error: '庭院启动失败，请刷新重试。',
    },
  };
  let language = 'en';
  let state = 'loading';
  try {
    if (localStorage.getItem('h2.pref.v1.garden_guard.language') === '3:01000000')
      language = 'zh-CN';
  } catch (_) { /* The App can still run without storage. */ }
  const showStatus = () => {
    document.documentElement.lang = language;
    document.title = messages[language].title;
    gameStatus.textContent = messages[language][state];
    gameStatus.dataset.ready = String(state === 'ready');
    document.getElementById('canvas').setAttribute('aria-label', messages[language].title);
  };
  showStatus();
  var Module = {
    canvas: document.getElementById('canvas'),
    preRun: [() => {
      // Keep purchases and settlement on a single writer for this origin.
      if (!navigator.locks) return;
      const dependency = 'garden-guard-profile';
      addRunDependency(dependency);
      state = 'wait';
      showStatus();
      navigator.locks.request(dependency, () => {
        removeRunDependency(dependency);
        return new Promise(() => {});
      }).catch(() => { removeRunDependency(dependency); });
    }],
    h2GardenLanguage: tag => {
      language = tag === 'zh-CN' ? tag : 'en';
      showStatus();
    },
    print: text => console.log(text),
    printErr: text => console.error(text),
    onRuntimeInitialized: () => {
      state = 'ready';
      showStatus();
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const setMotion = () => Module['_h2_garden_guard_web_reduce_motion'](motion.matches ? 1 : 0);
      setMotion();
      motion.addEventListener('change', setMotion);
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !event.repeat && !event.defaultPrevented)
          Module['_h2_garden_guard_web_back']();
      });
    },
    onAbort: () => { state = 'error'; showStatus(); },
  };
</script>
{{{ SCRIPT }}}
</html>
