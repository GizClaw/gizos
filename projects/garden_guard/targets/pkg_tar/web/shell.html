<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Garden Guard</title>
<style>
  html, body { margin: 0; height: 100%; background: #16200f; color: #e3ecd2;
    font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: grid; place-items: center; overscroll-behavior: none; }
  main { display: grid; gap: 12px; justify-items: center; padding: 16px; }
  canvas { width: min(92vw, 120vh, 720px); aspect-ratio: 3 / 2; border-radius: 18px;
    box-shadow: 0 18px 50px #000a; touch-action: none; cursor: pointer;
    image-rendering: auto; background: #2c4a1c; }
  p { margin: 0; opacity: .7; }
</style>
<main>
  <canvas id="canvas" width="480" height="320"></canvas>
  <p id="status">Loading…</p>
</main>
<script>
  const status = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    preRun: [() => {
      // Keep purchases and settlement on a single writer for this origin.
      if (!navigator.locks) return;
      const dependency = 'garden-guard-profile';
      addRunDependency(dependency);
      status.textContent = 'Waiting for access to your garden. Close any other Garden Guard tab on this address.';
      navigator.locks.request(dependency, () => {
        removeRunDependency(dependency);
        return new Promise(() => {});
      }).catch(() => { removeRunDependency(dependency); });
    }],
    print: text => console.log(text),
    printErr: text => console.error(text),
    onRuntimeInitialized: () => {
      status.textContent = 'Tap suns to collect them, pick a card, then tap a tile to plant.';
    },
    onAbort: reason => { status.textContent = 'Stopped: ' + reason; },
  };
</script>
{{{ SCRIPT }}}
</html>
