# TF1 layout. The RK3326 BootROM and vendor miniloader address these stages by sector.
image boot.vfat {
    vfat {
        label = "GIZOSBOOT"
        extraargs = "--invariant -F 16 -i 36335030 -h 32768"
        files = { "boot.scr", "Image", "r36s.dtb" }
    }
    size = 64M
}

image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
        disk-signature = 0x36335030
        fill = true
    }
    partition loader {
        in-partition-table = false
        offset = 32K
        image = "idbloader.img"
    }
    partition uboot {
        in-partition-table = false
        offset = 8M
        image = "uboot.img"
    }
    partition trust {
        in-partition-table = false
        offset = 12M
        image = "trust.img"
    }
    partition boot {
        bootable = true
        partition-type = 0x0e
        offset = 16M
        image = "boot.vfat"
    }
    partition root {
        partition-type = 0x83
        image = "rootfs.sqfs"
        size = 16M
    }
    size = 96M
}
