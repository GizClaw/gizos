# The area below H2PREF is intentionally not declared as a reserved file.
# JieLi's dual-bank updater owns that free NOR range and places the inactive
# executable bank there. H2Loader packages themselves are staged on SD; using
# a fixed H2APP reserved file here prevents the SDK from allocating Bank B.
H2PREF_ADR=0x00700000;
H2PREF_LEN=0x00040000;
H2PREF_OPT=1;
H2CORE_ADR=0x00740000;
H2CORE_LEN=0x00040000;
H2CORE_OPT=1;
H2VENDOR_ADR=0x00780000;
H2VENDOR_LEN=0x0007f000;
H2VENDOR_OPT=1;
