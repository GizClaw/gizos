<!-- tiga_esp_v4_2 "device" skin: the Tiga enclosure drawn in SVG after the
     product renders, screen and gem sides side by side (400 x 640 units each).
     Every key is its own shape: Back / OK above Left / Right, the gray
     microphone-shaped Power key between them, Volume Down on the left edge
     and Volume Up on the right edge. The large round gem is Record. -->
<style>
  body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at 50% 30%, #2a2340, #0c0a14 70%); color: #e5e7eb; font-family: system-ui, sans-serif; }
  .tiga { --w: min(360px, calc(78vh * 400 / 640), 56vw); --u: calc(var(--w) / 400); display: grid; gap: 14px; justify-items: center; }
  .tiga-views { display: flex; gap: calc(40 * var(--u)); align-items: flex-end; }
  .tiga-device { position: relative; width: var(--w); height: calc(640 * var(--u)); }
  .tiga-device.back { width: calc(0.6 * var(--w)); height: calc(0.6 * 640 * var(--u)); }
  .tiga svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 calc(14 * var(--u)) calc(18 * var(--u)) #000a); }
  .tiga-screen { position: absolute; left: calc(118 * var(--u)); top: calc(102 * var(--u)); width: calc(164 * var(--u)); height: calc(164 * var(--u)); display: grid; place-items: center; background: #000; border-radius: calc(4 * var(--u)); }
  .tiga #canvas { display: block; width: calc(164 * var(--u)); height: calc(164 * var(--u)); background: #000; }
  .tiga [data-h2-button] { cursor: pointer; transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 2.5px 0 #0008); transition: transform 70ms ease-out, filter 70ms ease-out; }
  .tiga [data-h2-button]:hover { filter: brightness(1.08) drop-shadow(0 2.5px 0 #0008); }
  .tiga [data-h2-button][data-pressed="true"] { transform: translateY(2.5px) scale(0.95); filter: brightness(0.78); transition-duration: 40ms; }
  .tiga [data-h2-button="volume_down"] { transform-origin: right center; transition-duration: 120ms; }
  .tiga [data-h2-button="volume_down"][data-pressed="true"] { transform: scaleX(0.6); }
  .tiga [data-h2-button="volume_up"] { transform-origin: left center; transition-duration: 120ms; }
  .tiga [data-h2-button="volume_up"][data-pressed="true"] { transform: scaleX(0.6); }
  .tiga .gem[data-pressed="true"] { transform: scale(0.9); filter: brightness(0.7) drop-shadow(0 0 0 #0000); }
  .tiga .gold { fill: url(#tiga-gold); stroke: #9a7424; stroke-width: 1.5; }
  .tiga .silver { fill: url(#tiga-silver); stroke: #6b7280; stroke-width: 1.5; }
  .tiga .icon { fill: none; stroke: #6b5313; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .tiga .silver + .icon, .tiga .side .icon { stroke: #4b5563; }
  .tiga [data-h2-slot="controls"] { display: flex; gap: 8px; }
  .tiga [data-h2-slot="controls"] button { padding: 6px 16px; border: 0; border-radius: 6px; background: #a78bfa; color: #1e1036; font: 700 12px system-ui, sans-serif; cursor: pointer; }
  .tiga [data-h2-slot="controls"] button:disabled { cursor: default; opacity: 0.6; }
  .tiga #status { margin: 0; color: #a1a1c2; font-size: 12px; }
  .tiga-hint { margin: 0; color: #77779a; font-size: 11px; }
</style>
