<!-- zero_esp_v3_0 "device" skin: the Zero enclosure drawn in SVG after the
     product renders, front and back side by side (440 x 640 units each).
     Every key is its own shape: Back / OK above Left / Right, the Power
     microphone key between them, Volume Down on the left edge and Volume Up on the
     right edge. The separate gem is Record. -->
<style>
  body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at 50% 30%, #1c2c44, #080d16 70%); color: #e5e7eb; font-family: system-ui, sans-serif; }
  .zero { --w: min(360px, calc(78vh * 440 / 640), 56vw); --u: calc(var(--w) / 440); display: grid; gap: 14px; justify-items: center; }
  .zero-views { display: flex; gap: calc(40 * var(--u)); align-items: flex-end; }
  .zero-device { position: relative; width: var(--w); height: calc(640 * var(--u)); }
  .zero-device.back { width: calc(0.6 * var(--w)); height: calc(0.6 * 640 * var(--u)); }
  .zero svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 calc(14 * var(--u)) calc(18 * var(--u)) #000a); }
  .zero-screen { position: absolute; left: calc(150 * var(--u)); top: calc(70 * var(--u)); width: calc(140 * var(--u)); height: calc(140 * var(--u)); display: grid; place-items: center; background: #000; border-radius: calc(4 * var(--u)); }
  .zero #canvas { display: block; width: calc(140 * var(--u)); height: calc(140 * var(--u)); background: #000; }
  .zero [data-h2-button] { cursor: pointer; transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 2.5px 0 #0008); transition: transform 70ms ease-out, filter 70ms ease-out; }
  .zero [data-h2-button]:hover { filter: brightness(1.08) drop-shadow(0 2.5px 0 #0008); }
  .zero [data-h2-button][data-pressed="true"] { transform: translateY(2.5px) scale(0.95); filter: brightness(0.78); transition-duration: 40ms; }
  .zero [data-h2-button="volume_down"] { transform-origin: right center; transition-duration: 120ms; }
  .zero [data-h2-button="volume_down"][data-pressed="true"] { transform: scaleX(0.6); }
  .zero [data-h2-button="volume_up"] { transform-origin: left center; transition-duration: 120ms; }
  .zero [data-h2-button="volume_up"][data-pressed="true"] { transform: scaleX(0.6); }
  .zero .gem[data-pressed="true"] { transform: scale(0.9); filter: brightness(0.7) drop-shadow(0 0 0 #0000); }
  .zero .key { fill: url(#zero-key); stroke: #4b5563; stroke-width: 1.5; }
  .zero .silver { fill: url(#zero-silver); stroke: #6b7280; stroke-width: 1.5; }
  .zero .icon { fill: none; stroke: #374151; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .zero [data-h2-slot="controls"] { display: flex; gap: 8px; }
  .zero [data-h2-slot="controls"] button { padding: 6px 16px; border: 0; border-radius: 6px; background: #93c5fd; color: #0b1a33; font: 700 12px system-ui, sans-serif; cursor: pointer; }
  .zero [data-h2-slot="controls"] button:disabled { cursor: default; opacity: 0.6; }
  .zero #status { margin: 0; color: #9fb3cc; font-size: 12px; }
  .zero-hint { margin: 0; color: #6b7f99; font-size: 11px; }
</style>
